<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Asset - EAM</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* =========================================================
           ISSUE FORM
        ========================================================= */

        .issue-form-page {
            max-width: 1500px;
            margin: 0 auto;
        }

        .issue-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
            overflow: hidden;
        }

        .issue-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(180deg, #fff, #f8fafc);
        }

        .issue-card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: #eff6ff;
            color: #2563eb;
            font-size: 18px;
            font-weight: 700;
        }

        .issue-card-header h2 {
            margin: 0;
            font-size: 18px;
            color: #172554;
        }

        .issue-card-header p {
            margin: 4px 0 0;
            font-size: 12px;
            color: #64748b;
        }

        .mandatory {
            color: #dc2626;
        }

        .issue-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px 38px;
            padding: 24px;
        }

        .form-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-field label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #334155;
            font-size: 13px;
            outline: none;
            transition: .2s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
        }

        textarea.form-control {
            height: 92px;
            padding-top: 11px;
            resize: vertical;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row .form-control {
            flex: 1;
        }

        .help-button {
            flex: 0 0 44px;
            height: 42px;
            border: 0;
            border-radius: 9px;
            background: #22c55e;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(34, 197, 94, .20);
        }

        .help-button:hover {
            background: #16a34a;
        }

        .date-row {
            display: flex;
            gap: 8px;
        }

        .date-row .form-control {
            flex: 1;
        }

        .clear-button {
            min-width: 74px;
            height: 42px;
            border: 0;
            border-radius: 8px;
            background: #64748b;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #475569;
        }

        .issue-actions {
            display: flex;
            gap: 10px;
            padding: 0 24px 24px;
        }

        .form-button {
            min-width: 105px;
            height: 42px;
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .form-button.primary {
            background: #2563eb;
            color: #fff;
        }

        .form-button.primary:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .form-button.secondary {
            background: #64748b;
            color: #fff;
        }

        .form-button.outline {
            background: #fff;
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .form-button:disabled {
            cursor: not-allowed;
            background: #cbd5e1 !important;
            color: #94a3b8 !important;
            border-color: #cbd5e1 !important;
            box-shadow: none;
        }

        /* =========================================================
           CART
        ========================================================= */

        .cart-section {
            margin-top: 22px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, .06);
            overflow: hidden;
        }

        .cart-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
        }

        .cart-section-header h3 {
            margin: 0;
            font-size: 15px;
        }

        .cart-section-header span {
            font-size: 12px;
            opacity: .9;
        }

        .cart-table-wrapper {
            overflow-x: auto;
        }

        .cart-table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        .cart-table th {
            padding: 11px 10px;
            background: #f8fafc;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-size: 12px;
        }

        .cart-table td {
            padding: 11px 10px;
            border-bottom: 1px solid #eef2f7;
            color: #475569;
            font-size: 12px;
        }

        .cart-table tbody tr:hover td {
            background: #f8fafc;
        }

        .cart-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .cart-empty {
            padding: 35px;
            text-align: center;
            color: #64748b;
        }

        .cart-empty strong {
            display: block;
            margin-bottom: 5px;
            color: #334155;
        }

        /* =========================================================
           POPUP
        ========================================================= */

        .lookup-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .58);
            backdrop-filter: blur(3px);
        }

        .lookup-modal.open {
            display: flex;
        }

        .lookup-dialog {
            width: min(900px, 96vw);
            max-height: 88vh;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, .25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .lookup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .lookup-header h3 {
            margin: 0;
            color: #172554;
            font-size: 18px;
        }

        .lookup-header p {
            margin: 4px 0 0;
            color: #64748b;
            font-size: 12px;
        }

        .lookup-close {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 20px;
            cursor: pointer;
        }

        .lookup-close:hover {
            background: #e2e8f0;
        }

        .lookup-filters {
            padding: 16px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            display: grid;
            grid-template-columns: 190px 1fr auto auto;
            gap: 9px;
            align-items: end;
        }

        .lookup-field label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 11px;
            font-weight: 700;
        }

        .lookup-field select,
        .lookup-field input {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            outline: none;
        }

        .lookup-button {
            height: 38px;
            padding: 0 14px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .lookup-button.light {
            background: #e2e8f0;
            color: #334155;
        }

        .lookup-table-wrapper {
            overflow: auto;
            flex: 1;
        }

        .lookup-table {
            width: 100%;
            border-collapse: collapse;
        }

        .lookup-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 11px 10px;
            background: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            color: #334155;
            text-align: left;
            font-size: 12px;
        }

        .lookup-table td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            color: #475569;
            font-size: 12px;
        }

        .lookup-table tbody tr:hover td {
            background: #eff6ff;
        }

        .lookup-table input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        .lookup-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 20px;
            border-top: 1px solid #e5e7eb;
        }

        .lookup-footer-info {
            color: #64748b;
            font-size: 12px;
        }

        .lookup-footer-actions {
            display: flex;
            gap: 8px;
        }

        .lookup-add {
            height: 40px;
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .lookup-add:hover {
            background: #15803d;
        }

        .lookup-add:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .selected-field {
            background: #f8fafc !important;
            color: #334155 !important;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .issue-form-grid {
                grid-template-columns: 1fr;
            }

            .lookup-filters {
                grid-template-columns: 1fr;
            }

            .lookup-footer {
                flex-direction: column;
                align-items: stretch;
            }

            .lookup-footer-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>

<div id="sidebar"></div>

<div class="main-content">

    <div id="header"></div>

    <main class="page-content">

        <div class="issue-form-page">

            <div class="page-breadcrumb">
                <span>EAM</span>
                <span>›</span>
                <span>Issue</span>
                <span>›</span>
                <strong>Issue Asset</strong>
            </div>

            <!-- =====================================================
                 ISSUE FORM
            ====================================================== -->

            <section class="issue-card">

                <div class="issue-card-header">

                    <div class="issue-card-icon">✓</div>

                    <div>
                        <h2>
                            Issue Asset
                            <span class="mandatory">(* Indicates Mandatory)</span>
                        </h2>

                        <p>
                            Enter the issue details and select the assets to be issued.
                        </p>
                    </div>

                </div>


                <div class="issue-form-grid">

                    <!-- LEFT COLUMN -->

                    <div class="form-column">

                        <div class="form-field">

                            <label>
                                Issue Asset To:
                                <span class="mandatory">*</span>
                            </label>

                            <select id="issueAssetTo" class="form-select">
                                <option value="">Select issue type</option>
                                <option value="all">All</option>
                                <option value="employee">Employee</option>
                                <option value="custodian">Custodian</option>
                                <option value="location">Location</option>
                            </select>

                        </div>


                        <div class="form-field">

                            <label>
                                Returnable
                                <span class="mandatory">*</span>
                            </label>

                            <select id="returnable" class="form-select">

                                <option value="Yes">
                                    Yes
                                </option>

                                <option value="No">
                                    No
                                </option>

                            </select>

                        </div>


                        <div class="form-field">

                            <label>
                                From Date
                                <span class="mandatory">*</span>
                            </label>

                            <div class="date-row">

                                <input
                                    type="date"
                                    id="fromDate"
                                    class="form-control"
                                >

                                <button
                                    type="button"
                                    class="clear-button"
                                    onclick="clearField('fromDate')"
                                >
                                    Clear
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                To Date
                            </label>

                            <div class="date-row">

                                <input
                                    type="date"
                                    id="toDate"
                                    class="form-control"
                                >

                                <button
                                    type="button"
                                    class="clear-button"
                                    onclick="clearField('toDate')"
                                >
                                    Clear
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                Asset Status
                            </label>

                            <select
                                id="assetStatus"
                                class="form-select"
                            >

                                <option value="Working">
                                    Working
                                </option>

                                <option value="Not Working">
                                    Not Working
                                </option>

                                <option value="Under Maintenance">
                                    Under Maintenance
                                </option>

                            </select>

                        </div>


                        <div class="form-field">

                            <label>
                                Remarks
                            </label>

                            <textarea
                                id="remarks"
                                class="form-control"
                                placeholder="Enter remarks..."
                            ></textarea>

                        </div>

                    </div>


                    <!-- RIGHT COLUMN -->

                    <div class="form-column">


                        <div class="form-field">

                            <label>
                                Search Department
                            </label>

                            <div class="search-row">

                                <input
                                    type="text"
                                    id="department"
                                    class="form-control"
                                    placeholder="Type department..."
                                >

                                <button
                                    type="button"
                                    class="help-button"
                                    title="Search Department"
                                    onclick="showDepartmentInfo()"
                                >
                                    ?
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                Department Incharge
                            </label>

                            <input
                                type="text"
                                id="departmentIncharge"
                                class="form-control"
                                readonly
                            >

                        </div>


                        <div class="form-field">

                            <label>
                                Search Employee
                            </label>

                            <div class="search-row">

                                <input
                                    type="text"
                                    id="employee"
                                    class="form-control"
                                    placeholder="Type employee name..."
                                >

                                <button
                                    type="button"
                                    class="help-button"
                                    title="Search Employee"
                                    onclick="showEmployeeInfo()"
                                >
                                    ?
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                Search Location
                            </label>

                            <div class="search-row">

                                <input
                                    type="text"
                                    id="location"
                                    class="form-control selected-field"
                                    placeholder="Select location..."
                                    readonly
                                >

                                <button
                                    type="button"
                                    class="help-button"
                                    title="Search Location"
                                    onclick="openLookup('location')"
                                >
                                    ?
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                Search Custodian
                                <span class="mandatory">*</span>
                            </label>

                            <div class="search-row">

                                <input
                                    type="text"
                                    id="custodian"
                                    class="form-control selected-field"
                                    placeholder="Select custodian..."
                                    readonly
                                >

                                <button
                                    type="button"
                                    class="help-button"
                                    title="Search Custodian"
                                    onclick="openLookup('custodian')"
                                >
                                    ?
                                </button>

                            </div>

                        </div>


                        <div class="form-field">

                            <label>
                                Custodian Department
                            </label>

                            <select
                                id="custodianDepartment"
                                class="form-select"
                            >

                                <option value="">
                                    Select department
                                </option>

                                <option>
                                    Department 1
                                </option>

                                <option>
                                    IT Department
                                </option>

                                <option>
                                    Administration
                                </option>

                                <option>
                                    Finance
                                </option>

                                <option>
                                    Operations
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- FORM ACTIONS -->

                <div class="issue-actions">

                    <button
                        type="button"
                        id="saveButton"
                        class="form-button primary"
                        disabled
                        onclick="saveIssue()"
                    >
                        Save
                    </button>

                    <button
                        type="button"
                        class="form-button secondary"
                        onclick="cancelIssue()"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="form-button outline"
                        onclick="goBackToCreate()"
                    >
                        Go Back
                    </button>

                </div>

            </section>


            <!-- =====================================================
                 CART ITEMS
            ====================================================== -->

            <section class="cart-section">

                <div class="cart-section-header">

                    <div>

                        <h3>
                            Asset Cart Items
                        </h3>

                        <span>
                            Select at least one asset to issue
                        </span>

                    </div>

                    <span id="cartHeaderCount">
                        0 Items
                    </span>

                </div>


                <div
                    id="cartTableContainer"
                    class="cart-table-wrapper"
                ></div>

            </section>

        </div>

    </main>

    <div id="footer"></div>

</div>


<!-- =========================================================
     LOOKUP MODAL
========================================================== -->

<div
    id="lookupModal"
    class="lookup-modal"
    onclick="closeLookupOnBackdrop(event)"
>

    <div class="lookup-dialog">

        <div class="lookup-header">

            <div>

                <h3 id="lookupTitle">
                    Select
                </h3>

                <p id="lookupSubtitle">
                    Select a record from the list.
                </p>

            </div>

            <button
                type="button"
                class="lookup-close"
                onclick="closeLookup()"
            >
                ×
            </button>

        </div>


        <div class="lookup-filters">

            <div class="lookup-field">

                <label>
                    Select
                </label>

                <select id="lookupSearchType">

                    <option value="name">
                        Name
                    </option>

                    <option value="code">
                        Code
                    </option>

                </select>

            </div>


            <div class="lookup-field">

                <label>
                    Value
                </label>

                <input
                    type="text"
                    id="lookupSearchInput"
                    placeholder="Enter search value..."
                >

            </div>


            <button
                type="button"
                class="lookup-button"
                onclick="filterLookup()"
            >
                🔍 Filter
            </button>


            <button
                type="button"
                class="lookup-button light"
                onclick="clearLookupFilter()"
            >
                Clear
            </button>

        </div>


        <div
            id="lookupTableContainer"
            class="lookup-table-wrapper"
        ></div>


        <div class="lookup-footer">

            <div
                id="lookupFooterInfo"
                class="lookup-footer-info"
            >
                Select one record.
            </div>

            <div class="lookup-footer-actions">

                <button
                    type="button"
                    class="lookup-button light"
                    onclick="closeLookup()"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    id="lookupAddButton"
                    class="lookup-add"
                    disabled
                    onclick="addLookupSelection()"
                >
                    ✓ Add Selection
                </button>

            </div>

        </div>

    </div>

</div>


<script src="./js/layout.js"></script>

<script>

    // =========================================================
    // FORM STATE
    // =========================================================

    let issueCart = [];

    let lookupType = "";

    let lookupData = [];

    let selectedLookupIndex = null;


    // =========================================================
    // SAMPLE LOCATION DATA
    // Replace with API data later
    // =========================================================

    const locations = [

        {
            name: "Ash Sharqiyah South-Al Ashakhra TS-Admin Building-1st floor-1500 Wide Corridor",
            code: "Beah-0366",
            type: "Passage"
        },

        {
            name: "Dhofar-Salalah (Raysuit) TS-Admin Building-Ground Floor-1500 Wide Corridor",
            code: "Beah-0600",
            type: "Passage"
        },

        {
            name: "Ash Sharqiyah South-Jalan Bani Bu Ali TS-Admin Building-1st floor-1500 Wide Corridor",
            code: "Beah-0420",
            type: "Passage"
        },

        {
            name: "Al Batinah North-Liwa TS-Admin Building-Second Floor-1500 Wide Corridor",
            code: "Beah-0438",
            type: "Passage"
        },

        {
            name: "Ash Sharqiyah South-Al Ashakhra TS-Admin Building-Ground Floor-1500 Wide Corridor",
            code: "Beah-0357",
            type: "Passage"
        },

        {
            name: "Head Office - IT Department",
            code: "LOC-IT-001",
            type: "Office"
        },

        {
            name: "Administration Department",
            code: "LOC-ADM-001",
            type: "Office"
        }

    ];


    // =========================================================
    // SAMPLE CUSTODIAN DATA
    // =========================================================

    const custodians = [

        {
            name: "Mohamed Jaafar Mohamed Al Mahdi",
            code: "beah-0168",
            department: "Department 1"
        },

        {
            name: "Abdulaziz Khamis Saleh Al Hakamani",
            code: "beah-0214",
            department: "Operations"
        },

        {
            name: "Mohamed Ahmed",
            code: "beah-0305",
            department: "Administration"
        },

        {
            name: "ASADMIN",
            code: "SYS-ADMIN",
            department: "IT Department"
        }

    ];


    // =========================================================
    // PAGE INITIALIZATION
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadIssueCart();

            setDefaultDates();

            renderCart();

            updateSaveButton();

        }
    );


    // =========================================================
    // LOAD CART FROM SESSION STORAGE
    // =========================================================

    function loadIssueCart() {

        const savedCart =
            sessionStorage.getItem("issueCart");


        if (!savedCart) {

            issueCart = [];

            return;

        }


        try {

            issueCart =
                JSON.parse(savedCart);

            if (!Array.isArray(issueCart)) {

                issueCart = [];

            }

        } catch (error) {

            console.error(
                "Unable to load issue cart:",
                error
            );

            issueCart = [];

        }

    }


    // =========================================================
    // DEFAULT DATE
    // =========================================================

    function setDefaultDates() {

        const fromDate =
            document.getElementById(
                "fromDate"
            );


        if (fromDate && !fromDate.value) {

            const today =
                new Date();


            const yyyy =
                today.getFullYear();


            const mm =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");


            const dd =
                String(
                    today.getDate()
                ).padStart(2, "0");


            fromDate.value =
                `${yyyy}-${mm}-${dd}`;

        }

    }


    // =========================================================
    // RENDER CART
    // =========================================================

    function renderCart() {

        const container =
            document.getElementById(
                "cartTableContainer"
            );


        const count =
            document.getElementById(
                "cartHeaderCount"
            );


        if (count) {

            count.textContent =
                `${issueCart.length} ${
                    issueCart.length === 1
                        ? "Item"
                        : "Items"
                }`;

        }


        if (issueCart.length === 0) {

            container.innerHTML = `

                <div class="cart-empty">

                    <div style="font-size:30px;">
                        🛒
                    </div>

                    <strong>
                        No assets in the cart
                    </strong>

                    <span>
                        Go back and add at least one asset.
                    </span>

                </div>

            `;


            updateSaveButton();

            return;

        }


        let rows = "";


        issueCart.forEach(
            function (asset, index) {

                rows += `

                    <tr>

                        <td style="text-align:center;">

                            <input
                                type="checkbox"
                                class="issue-asset-checkbox"
                                data-index="${index}"
                                onchange="updateSaveButton()"
                            >

                        </td>

                        <td>
                            <strong>
                                ${escapeHtml(asset.assetTag || "-")}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(asset.assetName || "-")}
                        </td>

                        <td>
                            ${escapeHtml(asset.serialNo || "-")}
                        </td>

                        <td>
                            ${escapeHtml(asset.model || "-")}
                        </td>

                        <td>
                            ${escapeHtml(asset.manufacturer || "-")}
                        </td>

                        <td>
                            ${escapeHtml(asset.invoiceNo || "2020/02")}
                        </td>

                        <td>
                            ${escapeHtml(asset.poNo || "PO200428")}
                        </td>

                    </tr>

                `;

            }
        );


        container.innerHTML = `

            <table class="cart-table">

                <thead>

                    <tr>

                        <th style="width:45px;text-align:center;">

                            <input
                                type="checkbox"
                                id="selectAllIssueAssets"
                                onchange="selectAllIssueAssets(this)"
                            >

                        </th>

                        <th>
                            Asset Tag
                        </th>

                        <th>
                            Asset Name
                        </th>

                        <th>
                            Serial No
                        </th>

                        <th>
                            Model
                        </th>

                        <th>
                            Manufacturer
                        </th>

                        <th>
                            Invoice No
                        </th>

                        <th>
                            PO No
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>

        `;


        updateSaveButton();

    }


    // =========================================================
    // SELECT ALL CART ITEMS
    // =========================================================

    function selectAllIssueAssets(source) {

        document
            .querySelectorAll(
                ".issue-asset-checkbox"
            )
            .forEach(
                function (checkbox) {

                    checkbox.checked =
                        source.checked;

                }
            );


        updateSaveButton();

    }


    // =========================================================
    // CHECK SELECTED ASSETS
    // =========================================================

    function getSelectedCartAssets() {

        const selected = [];


        document
            .querySelectorAll(
                ".issue-asset-checkbox:checked"
            )
            .forEach(
                function (checkbox) {

                    const index =
                        Number(
                            checkbox.dataset.index
                        );


                    if (
                        issueCart[index]
                    ) {

                        selected.push(
                            issueCart[index]
                        );

                    }

                }
            );


        return selected;

    }


    // =========================================================
    // ENABLE / DISABLE SAVE
    // =========================================================

    function updateSaveButton() {

        const saveButton =
            document.getElementById(
                "saveButton"
            );


        if (!saveButton) {

            return;

        }


        const selected =
            document.querySelectorAll(
                ".issue-asset-checkbox:checked"
            );


        saveButton.disabled =
            selected.length === 0;

    }


    // =========================================================
    // OPEN LOCATION / CUSTODIAN LOOKUP
    // =========================================================

    function openLookup(type) {

        lookupType = type;

        selectedLookupIndex = null;


        if (type === "location") {

            lookupData =
                locations.slice();


            document.getElementById(
                "lookupTitle"
            ).textContent =
                "Add Location";


            document.getElementById(
                "lookupSubtitle"
            ).textContent =
                "Select a location and add it to the issue form.";

            document.getElementById(
                "lookupSearchType"
            ).innerHTML = `

                <option value="name">
                    Location Name
                </option>

                <option value="code">
                    Location Code
                </option>

                <option value="type">
                    Location Type
                </option>

            `;

        } else {

            lookupData =
                custodians.slice();


            document.getElementById(
                "lookupTitle"
            ).textContent =
                "Add Custodian";


            document.getElementById(
                "lookupSubtitle"
            ).textContent =
                "Select a custodian and add the selected person to the issue form.";

            document.getElementById(
                "lookupSearchType"
            ).innerHTML = `

                <option value="name">
                    Custodian Name
                </option>

                <option value="code">
                    Employee Code
                </option>

                <option value="department">
                    Department
                </option>

            `;

        }


        document.getElementById(
            "lookupSearchInput"
        ).value = "";


        document.getElementById(
            "lookupAddButton"
        ).disabled = true;


        renderLookupTable(
            lookupData
        );


        document.getElementById(
            "lookupModal"
        ).classList.add("open");


        setTimeout(
            function () {

                document.getElementById(
                    "lookupSearchInput"
                ).focus();

            },
            100
        );

    }


    // =========================================================
    // RENDER LOOKUP TABLE
    // =========================================================

    function renderLookupTable(data) {

        const container =
            document.getElementById(
                "lookupTableContainer"
            );


        if (!data.length) {

            container.innerHTML = `

                <div class="cart-empty">

                    <strong>
                        No records found
                    </strong>

                    <span>
                        Try a different search value.
                    </span>

                </div>

            `;


            document.getElementById(
                "lookupFooterInfo"
            ).textContent =
                "0 records found.";


            return;

        }


        let rows = "";


        data.forEach(
            function (item, index) {

                if (lookupType === "location") {

                    rows += `

                        <tr>

                            <td style="width:45px;text-align:center;">

                                <input
                                    type="radio"
                                    name="lookupSelection"
                                    value="${index}"
                                    onchange="selectLookupRow(${index})"
                                >

                            </td>

                            <td>
                                ${escapeHtml(item.name)}
                            </td>

                            <td>
                                ${escapeHtml(item.code)}
                            </td>

                            <td>
                                ${escapeHtml(item.type)}
                            </td>

                        </tr>

                    `;

                } else {

                    rows += `

                        <tr>

                            <td style="width:45px;text-align:center;">

                                <input
                                    type="radio"
                                    name="lookupSelection"
                                    value="${index}"
                                    onchange="selectLookupRow(${index})"
                                >

                            </td>

                            <td>
                                ${escapeHtml(item.name)}
                            </td>

                            <td>
                                ${escapeHtml(item.code)}
                            </td>

                            <td>
                                ${escapeHtml(item.department)}
                            </td>

                        </tr>

                    `;

                }

            }
        );


        const headers =
            lookupType === "location"

                ? `
                    <th></th>
                    <th>Location Name</th>
                    <th>Location Code</th>
                    <th>Location Type</th>
                `

                : `
                    <th></th>
                    <th>Custodian Name</th>
                    <th>Employee Code</th>
                    <th>Department</th>
                `;


        container.innerHTML = `

            <table class="lookup-table">

                <thead>

                    <tr>
                        ${headers}
                    </tr>

                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        `;


        document.getElementById(
            "lookupFooterInfo"
        ).textContent =
            `${data.length} record${
                data.length === 1 ? "" : "s"
            } found. Select one to continue.`;

    }


    // =========================================================
    // SELECT LOOKUP RECORD
    // =========================================================

    function selectLookupRow(index) {

        selectedLookupIndex = index;


        document.getElementById(
            "lookupAddButton"
        ).disabled = false;

    }


    // =========================================================
    // ADD LOCATION / CUSTODIAN
    // =========================================================

    function addLookupSelection() {

        if (
            selectedLookupIndex === null ||
            !lookupData[selectedLookupIndex]
        ) {

            return;

        }


        const selected =
            lookupData[selectedLookupIndex];


        if (lookupType === "location") {

            document.getElementById(
                "location"
            ).value =
                selected.name;


        } else {

            document.getElementById(
                "custodian"
            ).value =
                `${selected.name} [${selected.code}]`;


            document.getElementById(
                "custodianDepartment"
            ).value =
                selected.department;

        }


        closeLookup();

    }


    // =========================================================
    // FILTER LOOKUP
    // =========================================================

    function filterLookup() {

        const searchType =
            document.getElementById(
                "lookupSearchType"
            ).value;


        const value =
            document.getElementById(
                "lookupSearchInput"
            ).value
            .toLowerCase()
            .trim();


        if (!value) {

            renderLookupTable(
                lookupData
            );

            return;

        }


        const filtered =
            lookupData.filter(
                function (item) {

                    return String(
                        item[searchType] || ""
                    )
                    .toLowerCase()
                    .includes(value);

                }
            );


        selectedLookupIndex = null;


        document.getElementById(
            "lookupAddButton"
        ).disabled = true;


        renderLookupTable(
            filtered
        );

    }


    // =========================================================
    // CLEAR LOOKUP FILTER
    // =========================================================

    function clearLookupFilter() {

        document.getElementById(
            "lookupSearchInput"
        ).value = "";


        selectedLookupIndex = null;


        document.getElementById(
            "lookupAddButton"
        ).disabled = true;


        renderLookupTable(
            lookupData
        );

    }


    // =========================================================
    // CLOSE LOOKUP
    // =========================================================

    function closeLookup() {

        document.getElementById(
            "lookupModal"
        ).classList.remove("open");

    }


    // =========================================================
    // CLOSE ON BACKDROP
    // =========================================================

    function closeLookupOnBackdrop(event) {

        if (
            event.target.id ===
            "lookupModal"
        ) {

            closeLookup();

        }

    }


    // =========================================================
    // DEPARTMENT HELP
    // =========================================================

    function showDepartmentInfo() {

        Swal.fire({

            icon: "info",

            title: "Search Department",

            text:
                "Enter the department name in the field. Department search can be connected to your backend API later.",

            confirmButtonText: "OK",

            confirmButtonColor: "#2563eb"

        });

    }


    // =========================================================
    // EMPLOYEE HELP
    // =========================================================

    function showEmployeeInfo() {

        Swal.fire({

            icon: "info",

            title: "Search Employee",

            text:
                "Enter the employee name in the field. Employee lookup can be connected to your backend API later.",

            confirmButtonText: "OK",

            confirmButtonColor: "#2563eb"

        });

    }


    // =========================================================
    // CLEAR FIELD
    // =========================================================

    function clearField(id) {

        const field =
            document.getElementById(id);


        if (field) {

            field.value = "";

        }

    }


    // =========================================================
    // SAVE ISSUE
    // =========================================================

    async function saveIssue() {

        const selectedAssets =
            getSelectedCartAssets();


        // -----------------------------------------------------
        // NO ASSET SELECTED
        // -----------------------------------------------------

        if (selectedAssets.length === 0) {

            await Swal.fire({

                icon: "warning",

                title: "Select Asset",

                text:
                    "Please select at least one asset from Asset Cart Items before saving.",

                confirmButtonText: "OK",

                confirmButtonColor: "#2563eb"

            });


            return;

        }


        // -----------------------------------------------------
        // REQUIRED FIELDS
        // -----------------------------------------------------

        const issueAssetTo =
            document.getElementById(
                "issueAssetTo"
            ).value;


        const fromDate =
            document.getElementById(
                "fromDate"
            ).value;


        const custodian =
            document.getElementById(
                "custodian"
            ).value;


        if (!issueAssetTo) {

            await Swal.fire({

                icon: "warning",

                title: "Issue Asset To Required",

                text:
                    "Please select who the asset is being issued to.",

                confirmButtonText: "OK",

                confirmButtonColor: "#2563eb"

            });


            return;

        }


        if (!fromDate) {

            await Swal.fire({

                icon: "warning",

                title: "From Date Required",

                text:
                    "Please select the From Date.",

                confirmButtonText: "OK",

                confirmButtonColor: "#2563eb"

            });


            return;

        }


        if (!custodian) {

            await Swal.fire({

                icon: "warning",

                title: "Custodian Required",

                text:
                    "Please select a custodian using the Search Custodian button.",

                confirmButtonText: "OK",

                confirmButtonColor: "#2563eb"

            });


            return;

        }


        // -----------------------------------------------------
        // SUCCESS
        // -----------------------------------------------------

        const transactionNo =
            "ISSUE/2026/" +
            Math.floor(
                7000 +
                Math.random() * 999
            );


        await Swal.fire({

            icon: "success",

            title: "Issue Created Successfully",

            html: `

                <div style="margin-bottom:10px;">

                    Asset issue transaction has been created successfully.

                </div>

                <div
                    style="
                        padding:10px;
                        border-radius:8px;
                        background:#eff6ff;
                        color:#1d4ed8;
                        font-weight:700;
                    "
                >

                    Transaction No:
                    ${transactionNo}

                </div>

                <div
                    style="
                        margin-top:10px;
                        color:#64748b;
                        font-size:12px;
                    "
                >

                    ${selectedAssets.length}
                    asset${
                        selectedAssets.length === 1
                            ? ""
                            : "s"
                    }
                    issued successfully.

                </div>

            `,

            confirmButtonText: "OK",

            confirmButtonColor: "#16a34a"

        });


        // -----------------------------------------------------
        // REMOVE SELECTED ASSETS FROM CART
        // -----------------------------------------------------

        const selectedTags =
            new Set(
                selectedAssets.map(
                    function (asset) {

                        return asset.assetTag;

                    }
                )
            );


        issueCart =
            issueCart.filter(
                function (asset) {

                    return !selectedTags.has(
                        asset.assetTag
                    );

                }
            );


        sessionStorage.setItem(
            "issueCart",
            JSON.stringify(issueCart)
        );


        // -----------------------------------------------------
        // GO TO LIST
        // -----------------------------------------------------

        window.location.href =
            "issue-list.html";

    }


    // =========================================================
    // CANCEL
    // =========================================================

    async function cancelIssue() {

        const result =
            await Swal.fire({

                icon: "question",

                title: "Cancel Issue?",

                text:
                    "Do you want to cancel this issue transaction?",

                showCancelButton: true,

                confirmButtonText:
                    "Yes, Cancel",

                cancelButtonText:
                    "Stay",

                confirmButtonColor:
                    "#dc2626",

                cancelButtonColor:
                    "#64748b",

                reverseButtons: true

            });


        if (result.isConfirmed) {

            window.location.href =
                "issue-list.html";

        }

    }


    // =========================================================
    // GO BACK
    // =========================================================

    function goBackToCreate() {

        window.location.href =
            "index.html";

    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>
