<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Issue List - EAM</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>
        /* =====================================================
           ISSUE LIST - SEPARATE FILTERS
        ===================================================== */

        .issue-filter-card {
            display: grid;
            grid-template-columns:
                minmax(170px, 1fr)
                minmax(160px, 1fr)
                minmax(220px, 1.3fr)
                minmax(190px, 1fr)
                auto
                auto;
            align-items: end;
            gap: 14px;
        }

        .issue-filter-card .filter-field {
            min-width: 0;
        }

        .issue-filter-card .filter-field input,
        .issue-filter-card .filter-field select {
            width: 100%;
        }

        .secondary-filter-button {
            background: #f8fafc;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .secondary-filter-button:hover {
            background: #f1f5f9;
        }

        @media (max-width: 1200px) {
            .issue-filter-card {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .issue-filter-card .filter-button {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .issue-filter-card {
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            .issue-filter-card .filter-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>

</head>


<body>


    <!-- =====================================================
         GENERIC SIDEBAR
    ====================================================== -->

    <div id="sidebar"></div>



    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <div class="main-content">


        <!-- =================================================
             GENERIC HEADER
        ================================================== -->

        <div id="header"></div>



        <!-- =================================================
             PAGE CONTENT
        ================================================== -->

        <main class="page-content">


            <!-- =================================================
                 BREADCRUMB
            ================================================== -->

            <div class="page-breadcrumb">

                <span>
                    EAM
                </span>

                <span>
                    ›
                </span>

                <span>
                    Issue
                </span>

                <span>
                    ›
                </span>

                <strong>
                    List
                </strong>

            </div>



            <!-- =================================================
                 PAGE HEADER
            ================================================== -->

            <div class="page-header">

                <div>

                    <h1>
                        Issue Assets
                    </h1>

                    <p>
                        View and manage asset issue transactions.
                    </p>

                </div>

            </div>



            <!-- =================================================
                 FILTER CARD
            ================================================== -->

            <section class="filter-card issue-filter-card">

                <div class="filter-field">
                    <label for="transactionDateFilter">Transaction Date</label>
                    <input type="date" id="transactionDateFilter" aria-label="Filter by transaction date">
                </div>

                <div class="filter-field">
                    <label for="issueTypeFilter">Issue Type</label>
                    <select id="issueTypeFilter" aria-label="Filter by issue type">
                        <option value="">All Issue Types</option>
                    </select>
                </div>

                <div class="filter-field filter-search">
                    <label for="transactionNoFilter">Transaction No</label>
                    <input type="text" id="transactionNoFilter" placeholder="Search transaction no..." autocomplete="off" aria-label="Search transaction number">
                </div>

                <div class="filter-field">
                    <label for="createdByFilter">Created By</label>
                    <select id="createdByFilter" aria-label="Filter by created by">
                        <option value="">All Created By</option>
                    </select>
                </div>

                <button type="button" class="filter-button" onclick="filterIssues()" title="Apply filters">
                    <span>🔍</span>
                    Filter
                </button>

                <button type="button" class="filter-button secondary-filter-button" onclick="resetIssueFilters()" title="Clear all filters">
                    <span>↻</span>
                    Reset
                </button>

            </section>


            <!-- =================================================
                 ISSUE TABLE
            ================================================== -->

            <section class="table-card">


                <!-- =================================================
                     TABLE HEADER
                ================================================== -->

                <div class="table-header">


                    <!-- Title -->

                    <div>

                        <h2>
                            Issue Asset
                        </h2>

                        <span id="recordCount">
                            10 Records
                        </span>

                    </div>



                    <!-- =================================================
                         ACTION BUTTONS
                    ================================================== -->

                    <div class="table-header-actions">


                        <!-- Reload -->

                        <button
                            type="button"
                            class="table-action-button reload-action"
                            onclick="reloadIssues()"
                            title="Reload Issue List"
                        >

                            <span class="action-icon">
                                ↻
                            </span>

                            Reload

                        </button>



                        <!-- Issue Asset -->

                        <button
                            type="button"
                            class="table-action-button issue-action"
                            onclick="openIssueAsset()"
                            title="Issue Asset"
                        >

                            <span class="action-icon">
                                ＋
                            </span>

                            Issue Asset

                        </button>


                    </div>


                </div>



                <!-- =================================================
                     TABLE
                ================================================== -->

                <div class="table-wrapper">


                    <table>


                        <!-- TABLE HEAD -->

                        <thead>

                            <tr>


                                <!-- Select -->

                                <th class="checkbox-column">

                                    <input
                                        type="checkbox"
                                        id="selectAll"
                                        onchange="selectAllIssues(this)"
                                        title="Select All"
                                    >

                                </th>



                                <!-- Transaction -->

                                <th>
                                    Transaction No
                                </th>



                                <!-- Date -->

                                <th>
                                    Transaction Date
                                </th>



                                <!-- Issue Type -->

                                <th>
                                    Issue Type
                                </th>



                                <!-- Created By -->

                                <th>
                                    Created By
                                </th>



                                <!-- Action -->

                                <th class="action-column">
                                    Action
                                </th>


                            </tr>

                        </thead>



                        <!-- TABLE BODY -->

                        <tbody id="issueTableBody">

                        </tbody>


                    </table>

                </div>



                <!-- =================================================
                     PAGINATION
                ================================================== -->

                <div class="pagination">


                    <!-- Pagination Buttons -->

                    <div class="pagination-buttons">


                        <button
                            type="button"
                            title="First Page"
                        >
                            «
                        </button>


                        <button
                            type="button"
                            title="Previous Page"
                        >
                            ‹
                        </button>


                        <button
                            type="button"
                            class="active-page"
                        >
                            1
                        </button>


                        <button
                            type="button"
                        >
                            2
                        </button>


                        <button
                            type="button"
                        >
                            3
                        </button>


                        <button
                            type="button"
                            title="Next Page"
                        >
                            ›
                        </button>


                        <button
                            type="button"
                            title="Last Page"
                        >
                            »
                        </button>


                    </div>



                    <!-- Pagination Information -->

                    <div class="pagination-info">

                        Showing

                        <strong>
                            1-10
                        </strong>

                        of

                        <strong>
                            13375
                        </strong>

                    </div>


                </div>


            </section>


        </main>



        <!-- =================================================
             GENERIC FOOTER
        ================================================== -->

        <div id="footer"></div>


    </div>

            },

        /* =====================================================
           DISPLAY ISSUES
        ====================================================== */

        function displayIssues(data) {


            const tbody =
                document.getElementById(
                    "issueTableBody"
                );


            tbody.innerHTML = "";



            if (data.length === 0) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty-table-cell"
                        >

                            <div class="empty-table-state">

                                <div class="empty-table-icon">
                                    🔍
                                </div>

                                <strong>
                                    No issues found
                                </strong>

                                <span>
                                    Try changing your search criteria.
                                </span>

                            </div>

                        </td>

                    </tr>

                `;


                document.getElementById(
                    "recordCount"
                ).textContent =
                    "0 Records";


                return;

            }



            data.forEach(
                function(issue, index) {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    const badgeClass =
                        issue.issueType
                            .toLowerCase();



                    row.innerHTML = `


                        <!-- CHECKBOX -->

                        <td class="checkbox-column">

                            <input
                                type="checkbox"
                                class="issue-checkbox"
                                data-transaction="${issue.transactionNo}"
                            >

                        </td>



                        <!-- TRANSACTION -->

                        <td>

                            <span
                                class="transaction-link"
                                onclick="viewIssue('${issue.transactionNo}')"
                            >

                                ${issue.transactionNo}

                            </span>

                        </td>



                        <!-- DATE -->

                        <td>

                            ${issue.transactionDate}

                        </td>



                        <!-- ISSUE TYPE -->

                        <td>

                            <span
                                class="issue-badge ${badgeClass}"
                            >

                                ${issue.issueType}

                            </span>

                        </td>



                        <!-- CREATED BY -->

                        <td>

                            ${issue.createdBy}

                        </td>



                        <!-- VIEW -->

                        <td class="action-column">

                            <button
                                type="button"
                                class="view-button"
                                onclick="viewIssue('${issue.transactionNo}')"
                                title="View Issue"
                            >

                                👁

                            </button>

                        </td>


                    `;


                    tbody.appendChild(row);


                }
            );



            document.getElementById(
                "recordCount"
            ).textContent =
                `${data.length} Records`;


        }



        /* =====================================================
           VIEW ISSUE
        ====================================================== */

        function viewIssue(transactionNo) {


            window.location.href =
                `issue-view.html?id=${encodeURIComponent(
                    transactionNo
                )}`;


        }



        /* =====================================================
           OPEN ISSUE ASSET PAGE
        ====================================================== */

        function openIssueAsset() {


            window.location.href =
                "issue-create.html";


        }



        /* =====================================================
           POPULATE FILTER DROPDOWNS
        ====================================================== */

        function populateIssueFilters() {

            const issueTypeSelect =
                document.getElementById("issueTypeFilter");

            const createdBySelect =
                document.getElementById("createdByFilter");

            const issueTypes = [
                ...new Set(
                    issueRows.map(issue => issue.issueType).filter(Boolean)
                )
            ].sort();

            const createdByUsers = [
                ...new Set(
                    issueRows.map(issue => issue.createdBy).filter(Boolean)
                )
            ].sort();

            issueTypes.forEach(function(type) {
                const option = document.createElement("option");
                option.value = type;
                option.textContent = type;
                issueTypeSelect.appendChild(option);
            });

            createdByUsers.forEach(function(user) {
                const option = document.createElement("option");
                option.value = user;
                option.textContent = user;
                createdBySelect.appendChild(option);
            });
        }


        /* =====================================================
           NORMALIZE TRANSACTION DATE
        ====================================================== */

        function getIssueDateValue(dateText) {

            if (!dateText) {
                return "";
            }

            const match = dateText.match(
                /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/
            );

            if (!match) {
                return "";
            }

            const months = {
                Jan: "01", Feb: "02", Mar: "03", Apr: "04",
                May: "05", Jun: "06", Jul: "07", Aug: "08",
                Sep: "09", Oct: "10", Nov: "11", Dec: "12"
            };

            const day = String(match[1]).padStart(2, "0");
            const month = months[match[2]];
            const year = match[3];

            return month ? `${year}-${month}-${day}` : "";
        }


        /* =====================================================
           FILTER ISSUES
        ====================================================== */

        function filterIssues() {

            const transactionDate =
                document.getElementById("transactionDateFilter").value.trim();

            const issueType =
                document.getElementById("issueTypeFilter").value.trim();

            const transactionNo =
                document.getElementById("transactionNoFilter").value
                    .toLowerCase()
                    .trim();

            const createdBy =
                document.getElementById("createdByFilter").value.trim();

            const filtered = issueRows.filter(function(issue) {

                const matchesDate =
                    !transactionDate ||
                    getIssueDateValue(issue.transactionDate) === transactionDate;

                const matchesIssueType =
                    !issueType ||
                    issue.issueType === issueType;

                const matchesTransactionNo =
                    !transactionNo ||
                    String(issue.transactionNo)
                        .toLowerCase()
                        .includes(transactionNo);

                const matchesCreatedBy =
                    !createdBy ||
                    issue.createdBy === createdBy;

                return (
                    matchesDate &&
                    matchesIssueType &&
                    matchesTransactionNo &&
                    matchesCreatedBy
                );
            });

            displayIssues(filtered);
        }


        /* =====================================================
           RESET ALL FILTERS
        ====================================================== */

        function resetIssueFilters() {

            document.getElementById("transactionDateFilter").value = "";
            document.getElementById("issueTypeFilter").value = "";
            document.getElementById("transactionNoFilter").value = "";
            document.getElementById("createdByFilter").value = "";

            displayIssues(issueRows);
        }


        /* =====================================================
           RELOAD ISSUES
        ====================================================== */

        function reloadIssues() {

            resetIssueFilters();

            const selectAll = document.getElementById("selectAll");

            if (selectAll) {
                selectAll.checked = false;
            }
        }


        /* =====================================================
           SELECT ALL ISSUES
        ====================================================== */

        function selectAllIssues(source) {


            const checkboxes =
                document.querySelectorAll(
                    ".issue-checkbox"
                );


            checkboxes.forEach(
                function(checkbox) {

                    checkbox.checked =
                        source.checked;

                }
            );


        }



        /* =====================================================
           TRANSACTION NO SEARCH - ENTER KEY
        ====================================================== */

        document
            .getElementById("transactionNoFilter")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        filterIssues();
                    }

                }
            );


        /* =====================================================
           INITIALIZE ISSUE LIST
        ====================================================== */

        populateIssueFilters();

        displayIssues(issueRows);


    </script>


</body>
