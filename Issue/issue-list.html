<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Issue List - EAM</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>
        /* =====================================================
           ISSUE LIST - SPLIT VIEW DESIGN
           Existing data, filters and JavaScript flow are preserved.
        ====================================================== */

        .issue-page-shell {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 110px);
        }

        .issue-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }

        .issue-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .issue-title-group h1 {
            margin: 0;
            font-size: 20px;
            color: #111827;
        }

        .generic-view-button {
            height: 32px;
            padding: 0 12px;
            border: 1px solid #4f46e5;
            border-radius: 8px;
            background: #fff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .generic-view-button:hover {
            background: #f5f3ff;
        }

        .issue-workspace {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            min-height: 760px;
            border: 1px solid #dfe4ec;
            border-radius: 10px;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .04);
        }

        .issue-list-pane {
            position: sticky;
            top: 0;
            align-self: start;
            min-width: 0;
            max-height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #dfe4ec;
            background: #fff;
        }

        .issue-list-pane-header {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
        }

        .issue-search-row {
            display: flex;
            gap: 8px;
        }

        .issue-search-box {
            position: relative;
            flex: 1;
        }

        .issue-search-box span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
        }

        .issue-search-box input {
            width: 100%;
            height: 38px;
            padding: 0 10px 0 34px;
            border: 1px solid #dfe4ec;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            font-size: 12px;
            background: #fff;
        }

        .issue-search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,.10);
        }

        .issue-filter-button {
            height: 38px;
            min-width: 82px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #dfe4ec;
            border-radius: 10px;
            background: #fff;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            box-sizing: border-box;
            transition: background .15s ease, border-color .15s ease;
        }

        .issue-filter-button:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        /* The filter control beside the search box is the primary filter trigger. */
        .modern-filter-card > .modern-filter-header {
            display: none;
        }

        .issue-list-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 9px;
            color: #64748b;
            font-size: 11px;
        }

        .issue-list-records {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .issue-list-row {
            position: relative;
            padding: 12px 16px;
            border-bottom: 1px solid #eef1f5;
            cursor: pointer;
            transition: background .15s ease;
        }

        .issue-list-row:hover {
            background: #f8fafc;
        }

        .issue-list-row.active {
            background: #eeedff;
        }

        .issue-list-row.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #4f46e5;
        }

        .issue-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .issue-row-title {
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
        }

        .issue-row-code {
            margin-top: 5px;
            color: #2563eb;
            font-size: 11px;
            font-weight: 600;
        }

        .issue-row-meta {
            margin-top: 3px;
            color: #64748b;
            font-size: 11px;
        }

        .issue-type-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            background: #eef2ff;
            color: #4338ca;
        }

        .issue-type-pill.custodian {
            background: #ecfdf5;
            color: #15803d;
        }

        .issue-type-pill.location {
            background: #fff7ed;
            color: #c2410c;
        }

        .issue-type-pill.employee {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-pill.green {
            background: #ecfdf3;
            color: #15803d;
        }

        .status-pill.orange {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-pill.gray {
            background: #f1f5f9;
            color: #475569;
        }

        .issue-list-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 11px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
            color: #64748b;
            font-size: 11px;
        }

        .issue-pagination {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .issue-pagination-btn {
            min-width: 24px;
            height: 24px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dfe4ec;
            border-radius: 6px;
            background: #fff;
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            cursor: default;
        }

        .issue-pagination-btn.active {
            border-color: #4f46e5;
            background: #4f46e5;
            color: #fff;
        }

        .issue-pagination-btn[disabled] {
            opacity: .45;
            cursor: not-allowed;
        }

        .issue-detail-pane {
            min-width: 0;
            min-height: 0;
            background: #f8fafc;
            overflow-y: auto;
        }

        .issue-detail-empty {
            height: 100%;
            min-height: 600px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .issue-detail-empty-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 22px;
        }

        .issue-detail-content {
            padding: 18px 20px 28px;
        }

        /* =====================================================
           SELECTED-ISSUE CHIP BAR
        ====================================================== */

        .issue-chip-bar {
            display: flex;
            align-items: stretch;
            overflow-x: auto;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .issue-chip {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            border-right: 1px solid #e2e8f0;
            background: #f1f5f9;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease;
        }

        .issue-chip:hover {
            background: #e8edf3;
        }

        .issue-chip.active {
            background: #fff;
            box-shadow: inset 0 -2px 0 #4f46e5;
        }

        .issue-chip.active:hover {
            background: #fff;
        }

        .issue-chip-avatar {
            width: 26px;
            height: 26px;
            flex: 0 0 26px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 10px;
            font-weight: 800;
        }

        .issue-chip-title {
            color: #0f172a;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
        }

        .issue-chip-code {
            color: #2563eb;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.25;
        }

        .issue-chip-close {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }

        .issue-chip-close:hover {
            background: #f1f5f9;
            color: #475569;
        }

        .issue-detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
            background: #fff;
            margin: 0 -20px 18px;
            padding: 16px 20px 15px;
        }

        .issue-detail-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .issue-detail-title {
            margin: 0;
            color: #111827;
            font-size: 19px;
        }

        .issue-detail-subtitle {
            margin-top: 5px;
            color: #64748b;
            font-size: 11px;
        }

        .issue-detail-actions {
            display: flex;
            gap: 7px;
        }

        .issue-detail-action {
            height: 32px;
            padding: 0 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #334155;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .issue-detail-action.primary {
            border-color: #4f46e5;
            background: #4f46e5;
            color: #fff;
        }

        .issue-detail-action.create {
            border-color: #4f46e5;
            background: #fff;
            color: #4f46e5;
        }

        .issue-detail-action.create:hover {
            background: #f5f3ff;
        }

        .issue-detail-action:hover {
            background: #f1f5f9;
        }

        .issue-detail-action.primary:hover {
            background: #4338ca;
        }

        .issue-status-line {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 18px;
        }

        .detail-label-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 5px;
            background: #0f7891;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .detail-value-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border: 1px solid #dbe3ee;
            border-radius: 5px;
            background: #fff;
            color: #334155;
            font-size: 10px;
            font-weight: 700;
        }

        .issue-detail-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .issue-detail-cell {
            min-height: 74px;
            padding: 13px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
        }

        .issue-detail-cell span {
            display: block;
            margin-bottom: 7px;
            color: #64748b;
            font-size: 10px;
            text-transform: uppercase;
        }

        .issue-detail-cell strong {
            display: block;
            color: #111827;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }

        .issue-section {
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
        }

        .issue-section-title {
            padding: 11px 13px;
            border-bottom: 1px solid #e5e7eb;
            color: #111827;
            font-size: 12px;
            font-weight: 700;
        }

        .issue-detail-table {
            width: 100%;
            border-collapse: collapse;
        }

        .issue-detail-table th,
        .issue-detail-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf0f4;
            text-align: left;
            font-size: 11px;
        }

        .issue-detail-table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
        }

        .issue-detail-table td {
            color: #111827;
        }

        .issue-detail-table tr:last-child td {
            border-bottom: 0;
        }

        /* Filter popup */
        .filter-toggle-button {
            height: 36px;
            min-width: 78px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #4f46e5;
            border-radius: 8px;
            background: #fff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-sizing: border-box;
            transition: background .15s ease, border-color .15s ease;
        }

        .filter-toggle-button:hover {
            background: #f5f3ff;
        }

        .modern-filter-body {
            position: absolute;
            top: 54px;
            left: 8px;
            right: 8px;
            width: min(525px, calc(100vw - 28px));
            max-height: 620px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 14px;
            padding: 0 14px 54px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(15,23,42,.16);
            overflow-y: auto;
        }

        .modern-filter-body.hidden {
            display: none !important;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .modern-filter-body:not(.hidden) {
            display: grid;
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        .modern-filter-body::before {
            content: "Filter records";
            grid-column: 1 / -1;
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            min-height: 44px;
            margin: 0 -14px 2px;
            padding: 0 14px;
            border-bottom: 1px solid #eef2f7;
            background: #fff;
            color: #111827;
            font-size: 12px;
            font-weight: 700;
        }

        .modern-filter-body::after {
            content: "Clear all";
            position: absolute;
            top: 0;
            right: 14px;
            height: 44px;
            display: flex;
            align-items: center;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
        }

        .modern-filter-field {
            min-width: 0;
        }

        .modern-filter-field label {
            display: block;
            margin: 14px 0 6px;
            color: #111827;
            font-size: 11px;
            font-weight: 700;
        }

        .modern-filter-field input,
        .modern-filter-field select {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #cfd8e6;
            border-radius: 7px;
            background: #fff;
            color: #374151;
            font-size: 11px;
            outline: none;
            box-sizing: border-box;
        }

        .modern-filter-field input:focus,
        .modern-filter-field select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,.10);
        }

        .input-icon {
            position: relative;
        }

        .input-icon span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            font-size: 12px;
        }

        .input-icon input {
            padding-left: 30px;
        }

        .modern-filter-actions {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 9px;
            z-index: 4;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .modern-primary-button,
        .modern-secondary-button {
            height: 34px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .modern-primary-button {
            border: 1px solid #4f46e5;
            background: #4f46e5;
            color: #fff;
        }

        .modern-secondary-button {
            border: 1px solid #d8e1ec;
            background: #fff;
            color: #475569;
        }


        /* =====================================================
           RICH ISSUED ASSET CARD
           Used inside the selected-issue detail panel.
        ====================================================== */

        .issued-assets-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        .issued-assets-title {
            color: #111827;
            font-size: 12px;
            font-weight: 700;
        }

        .issued-assets-count {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 10px;
            font-weight: 800;
        }

        .issued-asset-list {
            display: grid;
            gap: 10px;
            padding: 12px;
        }

        .issued-asset-card {
            overflow: hidden;
            border: 1px solid #dbe4ef;
            border-radius: 10px;
            background: #fff;
        }

        .issued-asset-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            background: linear-gradient(180deg, #f8fbff 0%, #fff 100%);
            border-bottom: 1px solid #e8eef5;
        }

        .issued-asset-title-group {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            min-width: 0;
        }

        .issued-asset-icon {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 16px;
            font-weight: 800;
        }

        .issued-asset-title-group h3 {
            margin: 0;
            color: #0f172a;
            font-size: 13px;
            line-height: 1.35;
        }

        .issued-asset-title-group p {
            margin: 3px 0 0;
            color: #64748b;
            font-size: 10px;
        }

        .issued-asset-tag {
            display: inline-flex;
            align-items: center;
            margin-top: 5px;
            padding: 3px 7px;
            border: 1px solid #bfdbfe;
            border-radius: 5px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 9px;
            font-weight: 800;
        }

        .issued-asset-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .issued-asset-status.returned {
            border: 1px solid #bbf7d0;
            background: #dcfce7;
            color: #166534;
        }

        .issued-asset-status.not-returned {
            border: 1px solid #fed7aa;
            background: #fff7ed;
            color: #c2410c;
        }

        .issued-asset-key-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            padding: 10px 12px;
        }

        .issued-asset-key-item {
            min-height: 52px;
            padding: 9px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            background: #f8fafc;
        }

        .issued-asset-key-item.highlight {
            border-color: #bfdbfe;
            background: #eff6ff;
        }

        .issued-asset-key-item .label,
        .issued-asset-extra-item .label {
            display: block;
            margin-bottom: 4px;
            color: #64748b;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .issued-asset-key-item .value {
            color: #0f172a;
            font-size: 10px;
            font-weight: 800;
            line-height: 1.35;
            word-break: break-word;
        }

        .issued-asset-key-item.highlight .value {
            color: #1d4ed8;
        }

        .issued-asset-more {
            border-top: 1px solid #e8eef5;
        }

        .issued-asset-more summary {
            padding: 9px 12px;
            color: #475569;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            list-style: none;
        }

        .issued-asset-more summary::-webkit-details-marker {
            display: none;
        }

        .issued-asset-more summary::before {
            content: "+";
            display: inline-grid;
            width: 17px;
            height: 17px;
            margin-right: 6px;
            place-items: center;
            border-radius: 4px;
            background: #f1f5f9;
            color: #475569;
        }

        .issued-asset-more[open] summary::before {
            content: "−";
        }

        .issued-asset-more-content {
            padding: 0 12px 10px;
        }

        .issued-asset-extra-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .issued-asset-extra-item {
            padding: 8px 9px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            background: #fff;
        }

        .issued-asset-extra-item .value {
            color: #334155;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
        }

        .issued-asset-location {
            margin: 0 12px 12px;
            padding: 9px 10px;

        /* =====================================================
           UPDATE ISSUE SUMMARY
        ====================================================== */

        function updateIssueKPIs(data) {

            const total =
                document.getElementById("totalIssueCount");

            const custodian =
                document.getElementById("custodianIssueCount");

            const location =
                document.getElementById("locationIssueCount");

            const employee =
                document.getElementById("employeeIssueCount");

            const today =
                document.getElementById("todayIssueCount");

            if (total) {
                total.textContent = data.length;
            }

            if (custodian) {
                custodian.textContent =
                    data.filter(
                        issue => issue.issueType === "Custodian"
                    ).length;
            }

            if (location) {
                location.textContent =
                    data.filter(
                        issue => issue.issueType === "Location"
                    ).length;
            }

            if (employee) {
                employee.textContent =
                    data.filter(
                        issue =>
                            issue.issueType === "Employee" ||
                            Number(issue.employeeCount || 0) > 0
                    ).length;
            }

            if (today) {

                const now = new Date();

                const todayYear =
                    now.getFullYear();

                const todayMonth =
                    now.getMonth();

                const todayDay =
                    now.getDate();

                const monthMap = {
                    Jan: 0,
                    Feb: 1,
                    Mar: 2,
                    Apr: 3,
                    May: 4,
                    Jun: 5,
                    Jul: 6,
                    Aug: 7,
                    Sep: 8,
                    Oct: 9,
                    Nov: 10,
                    Dec: 11
                };

                const todayCount =
                    data.filter(function(issue) {

                        const match =
                            String(issue.transactionDate || "")
                                .match(
                                    /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/
                                );

                        if (!match) {
                            return false;
                        }

                        return (
                            Number(match[1]) === todayDay &&
                            monthMap[match[2]] === todayMonth &&
                            Number(match[3]) === todayYear
                        );

                    }).length;

                today.textContent = todayCount;
            }
        }


        /* =====================================================
           DISPLAY ISSUES
        ====================================================== */

        function displayIssues(data) {

            const list = document.getElementById("issueListRecords");

            if (!list) {
                return;
            }

            list.innerHTML = "";

            const recordCount = document.getElementById("recordCount");
            const showingText = document.getElementById("issueShowingText");
            const totalText = document.getElementById("issueTotalText");

            if (!data || data.length === 0) {
                list.innerHTML = `
                    <div style="padding:40px 15px;text-align:center;color:#64748b;font-size:12px;">
                        <div style="font-size:22px;margin-bottom:8px;">🔍</div>
                        <strong style="display:block;color:#334155;">No issues found</strong>
                        <span>Try changing your search criteria.</span>
                    </div>
                `;

                if (recordCount) recordCount.textContent = "0 Records";
                if (showingText) showingText.textContent = "1-0";
                if (totalText) totalText.textContent = "of 0";

                updateIssueKPIs(data || []);
                return;
            }

            data.forEach(function(issue, index) {

                const issueDetail = mergeIssueData(issue);
                const row = document.createElement("div");
                const badgeClass = String(issueDetail.issueType || "").toLowerCase();
                const assets = getIssueAssets(issueDetail);
                const primaryAsset = assets[0] || {};
                const assetSummary = issueValue(
                    primaryAsset.assetName || primaryAsset.assetTag || primaryAsset.serialNo,
                    "No asset details"
                );
                const dateRange = issueDetail.fromDate && issueDetail.toDate
                    ? `${escapeIssueHtml(issueDetail.fromDate)} → ${escapeIssueHtml(issueDetail.toDate)}`
                    : "";

                row.className = "issue-list-row";
                row.dataset.transaction = issueDetail.transactionNo || "";

                row.innerHTML = `
                    <div class="issue-row-top">
                        <span class="issue-row-title">
                            ${escapeIssueHtml(issueDetail.transactionNo || "-")}
                        </span>

                        <span class="issue-type-pill ${badgeClass}">
                            ● ${escapeIssueHtml(issueDetail.issueType || "-")}
                        </span>
                    </div>

                    <div class="issue-row-meta">
                        Issued to: ${escapeIssueHtml(issueValue(issueDetail.issuedTo, "Unknown"))} &nbsp;·&nbsp; Returnable: ${escapeIssueHtml(issueValue(issueDetail.returnable, "N/A"))}
                    </div>

                    ${dateRange ? `<div class="issue-row-code">${dateRange}</div>` : ""}

                    <div class="issue-row-meta">
                        ${escapeIssueHtml(assetSummary)}
                    </div>

                    <div class="issue-row-meta">
                        ${escapeIssueHtml(issueDetail.transactionDate || "-")}
                    </div>

                    <div class="issue-row-meta">
                        ${escapeIssueHtml(issueDetail.createdBy || "-")}
                    </div>
                `;

                row.addEventListener("click", function() {
                    document.querySelectorAll(".issue-list-row.active")
                        .forEach(function(activeRow) {
                            activeRow.classList.remove("active");
                        });

                    row.classList.add("active");
                    openIssueTab(issueDetail.transactionNo);
                });

                list.appendChild(row);

                if (index === 0) {
                    row.classList.add("active");
                    openIssueTab(issueDetail.transactionNo);
                }
            });

            if (recordCount) {
                recordCount.textContent = `${data.length} Records`;
            }

            if (showingText) {
                showingText.textContent = `1-${data.length}`;
            }

            if (totalText) {
                totalText.textContent = `of ${data.length}`;
            }

            updateIssueKPIs(data);
        }

        function escapeIssueHtml(value) {
            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function issueValue(value, fallback = "Not available") {
            if (
                value === null ||
                value === undefined ||
                String(value).trim() === ""
            ) {
                return fallback;
            }

            return String(value);
        }

        function mergeIssueData(issue) {
            if (!issue || !issue.transactionNo) {
                return issue;
            }

            const details = issueData?.[issue.transactionNo];

            if (!details) {
                return issue;
            }

            return {
                ...issue,
                ...details
            };
        }

        function getIssueAssets(issue) {
            if (Array.isArray(issue.assets) && issue.assets.length) {
                return issue.assets;
            }

            if (issue.asset) {
                return [issue.asset];
            }

            return [];
        }

        function getIssueChipInfo(issue) {
            const assets = getIssueAssets(issue);
            const primaryAsset = assets[0] || {};

            const chipTitle = issueValue(
                primaryAsset.assetName || primaryAsset.assetTag,
                issue.transactionNo || "Issue"
            );

            const chipInitials = chipTitle
                .replace(/[^A-Za-z0-9]/g, " ")
                .trim()
                .split(/\s+/)
                .slice(0, 2)
                .map(word => word.charAt(0).toUpperCase())
                .join("") || "IS";

            return { chipTitle, chipInitials };
        }

        function buildIssueDetailContentHtml(issue) {

            const assetCount = Number(
                issue.assetCount ??
                assets.length
            );

            const issueType = issue.issueType || "-";
            const badgeClass = issueType.toLowerCase();

            let assetContent = "";

            if (assets.length > 0) {

                assetContent = `

                        ${assets.map(function(asset, index) {

                                String(asset.returned || "")
                                    .toLowerCase() === "yes";

                            const assetName =
                                asset.assetName ??
                                asset.name ??
                                asset.assetTag ??
                                asset.serialNo ??
                                `Asset ${index + 1}`;

                                asset.assetTag ??
                                asset.assetCode ??

                            return `

                                            <div class="issued-asset-icon">

                                                </h3>

                                                <p>
                                                    Asset ${index + 1}
                                                    of ${assets.length}
                                                </p>

                                                <span class="issued-asset-tag">
                                                    ${escapeIssueHtml(
                                                        issueValue(assetTag)
                                                    )}
                                                </span>

                                            </div>

                                        </div>

                                        <span class="issued-asset-status ${
                                            returned
                                                ? "returned"
                                                : "not-returned"
                                        }">
                                            ${
                                                returned
                                                    ? "● Returned"
                                                    : "● Not Returned"
                                            }
                                        </span>

                                    </div>

                                    <div class="issued-asset-key-grid">

                                        <div class="issued-asset-key-item">

                                            <span class="label">
                                                Asset Name
                                            </span>

                                            <span class="value">
                                                ${escapeIssueHtml(
                                                    issueValue(assetName)
                                                )}
                                            </span>

                                        </div>

                                        <div class="issued-asset-key-item highlight">

                                            <span class="label">
                                                Asset Tag
                                            </span>

                                            <span class="value">
                                                ${escapeIssueHtml(
                                                    issueValue(assetTag)
                                                )}
                                            </span>

                                        </div>

                                        <div class="issued-asset-key-item">

                                            <span class="label">
                                                Serial No
                                            </span>

                                            <span class="value">
                                                ${escapeIssueHtml(
                                                    issueValue(
                                                        asset.serialNo
                                                    )
                                                )}
                                            </span>

                                        </div>

                                        <div class="issued-asset-key-item">

                                            <span class="label">
                                                Model
                                            </span>

                                            <span class="value">
                                                ${escapeIssueHtml(
                                                    issueValue(
                                                        asset.model
                                                    )
                                                )}
                                            </span>

                                        </div>

                                    </div>

                                    <details class="issued-asset-more">

                                        <summary>
                                            View more asset information
                                        </summary>

                                        <div class="issued-asset-more-content">

                                            <div class="issued-asset-extra-grid">

                                                <div class="issued-asset-extra-item">

                                                    <span class="label">
                                                        Manufacturer
                                                    </span>

                                                    <span class="value">
                                                        ${escapeIssueHtml(
                                                            issueValue(
                                                                asset.manufacturer
                                                            )
                                                        )}
                                                    </span>

                                                </div>

                                                <div class="issued-asset-extra-item">

                                                    <span class="label">
                                                        Description
                                                    </span>

                                                    <span class="value">
                                                        ${escapeIssueHtml(
                                                            issueValue(
                                                                asset.description
                                                            )
                                                        )}
                                                    </span>

                                                </div>

                                                <div class="issued-asset-extra-item">

                                                    <span class="label">
                                                        Return Status
                                                    </span>

                                                    <span class="value">
                                                        ${escapeIssueHtml(
                                                            issueValue(
                                                                asset.returned
                                                            )
                                                        )}
                                                    </span>

                                                </div>

                                            </div>

                                        </div>

                                    </details>

                                    <div class="issued-asset-location">

                                        <span class="label">
                                            Asset Location
                                        </span>

                                        <strong>
                                            ${escapeIssueHtml(
                                                issueValue(
                                                    asset.location
                                                )
                                            )}
                                        </strong>

                                    </div>

                                </article>
                            `;

                        }).join("")}

                    </div>
                `;

            } else {

                assetContent = `
                    <div class="issued-assets-empty">
                        Asset-level details are not available for this transaction.
                    </div>
                `;

            }

            return `
                <div class="issue-detail-content">

                    <div class="issue-detail-header">

                        <div>

                            <div class="issue-detail-title-row">
                                <h2 class="issue-detail-title">
                                    ${escapeIssueHtml(
                                        issue.transactionNo ||
                                        "Issue Transaction"
                                    )}

                                <span class="issue-type-pill ${badgeClass}">
                                    ● ${escapeIssueHtml(issueType)}
                                </span>
                            </div>

                            <div class="issue-detail-subtitle">
                                Issue transaction details
                            </div>

                        </div>

                        <div class="issue-detail-actions">

                            <button
                                type="button"
                                class="issue-detail-action"
                                onclick="reloadIssues()"
                            >
                                ↻ Reload
                            </button>

                            <button
                                type="button"
                                class="issue-detail-action create"
                                onclick="openIssueAsset()"

                                ＋ Create
                            </button>

                            <button
                                type="button"
                                class="issue-detail-action primary"
                                onclick="viewIssue('${String(
                                    issue.transactionNo || ""
                                ).replace(/'/g, "\\'") }')"
                            >
                                👁 View
                            </button>

                        </div>

                    </div>

                    <div class="issue-status-line">

                        <span class="detail-label-badge">
                            ISSUE TYPE
                        </span>

                        <span class="detail-value-badge ${badgeClass}">
                            ${escapeIssueHtml(issueType)}
                        </span>

                        <span class="detail-label-badge">
                            ASSET COUNT
                        </span>

                        <span class="detail-value-badge">
                            ${assetCount}
                        </span>

                    </div>

                    <div class="issue-detail-grid">

                        <div class="issue-detail-cell">

                            <span>
                                Transaction No
                            </span>

                            <strong>
                                ${escapeIssueHtml(
                                    issue.transactionNo || "-"
                                )}
                            </strong>

                        </div>

                        <div class="issue-detail-cell">

                            <span>
                                Transaction Date
                            </span>

                            <strong>
                                ${escapeIssueHtml(
                                    issue.transactionDate || "-"
                                )}
                            </strong>

                        </div>

                        <div class="issue-detail-cell">

                            <span>
                                Issue Type
                            </span>

                            <strong>
                                ${escapeIssueHtml(issueType)}
                            </strong>

                        </div>

                        <div class="issue-detail-cell">

                            <span>
                                Created By
                            </span>

                            <strong>
                                ${escapeIssueHtml(
                                    issue.createdBy || "-"
                                )}
                            </strong>

                        </div>

                    </div>

                    <div class="issue-period-row">

                        <div class="issue-period-card">
                            <span class="label">Issue Period</span>
                            <strong>${escapeIssueHtml(issueValue(issue.fromDate))}</strong>
                            <span class="arrow">→</span>
                            <strong>${escapeIssueHtml(issueValue(issue.toDate))}</strong>
                        </div>

                        <span class="issue-returnable-badge ${
                            String(issue.returnable || "").toLowerCase() === "yes"
                                ? "yes"
                                : "no"
                        }">
                            ${
                                String(issue.returnable || "").toLowerCase() === "yes"
                                    ? "● Returnable"
                                    : "● Non-returnable"
                            }
                        </span>

                    </div>

                    <section class="issue-section">

                        <div class="issued-assets-header">

                            <span class="issued-assets-title">
                                Issued Assets
                            </span>

                            <span class="issued-assets-count">
                                ${assetCount}
                                ${assetCount === 1 ? "Asset" : "Assets"}
                            </span>

                        </div>

                        ${assetContent}

                    </section>

                </div>
            `;
        }


        /* =====================================================
           MULTI-TAB SELECTION
           Selecting another record adds a tab instead of
           replacing the one already open.
        ====================================================== */

        let openIssueTransactions = [];
        let activeIssueTransaction = null;

        function findIssueRecord(transactionNo) {
            const raw = allIssueRows.find(function(row) {
                return row.transactionNo === transactionNo;
            });

            return raw ? mergeIssueData(raw) : null;
        }

        function syncActiveListRow() {
            document.querySelectorAll(".issue-list-row").forEach(function(row) {
                row.classList.toggle(
                    "active",
                    row.dataset.transaction === activeIssueTransaction
                );
            });
        }

        function openIssueTab(transactionNo) {
            if (!transactionNo) {
                return;
            }

            if (!openIssueTransactions.includes(transactionNo)) {
                openIssueTransactions.push(transactionNo);
            }

            activeIssueTransaction = transactionNo;
            renderIssuePane();
        }

        function selectIssueTab(transactionNo) {
            activeIssueTransaction = transactionNo;
            renderIssuePane();
            syncActiveListRow();
        }

        function closeIssueTab(transactionNo, event) {
            if (event) {
                event.stopPropagation();
            }

            openIssueTransactions = openIssueTransactions.filter(function(tx) {
                return tx !== transactionNo;
            });

            if (activeIssueTransaction === transactionNo) {
                activeIssueTransaction = openIssueTransactions.length
                    ? openIssueTransactions[openIssueTransactions.length - 1]
                    : null;
            }

            renderIssuePane();
            syncActiveListRow();
        }

        function renderIssuePane() {

            const pane = document.getElementById("issueDetailPane");

            if (!pane) {
                return;
            }

            if (!openIssueTransactions.length || !activeIssueTransaction) {
                pane.innerHTML = `
                    <div class="issue-detail-empty">
                        <div>
                            <div class="issue-detail-empty-icon">▣</div>
                            <strong>Select an issue transaction</strong>
                            <div style="margin-top:5px;font-size:11px;">
                                Select a transaction from the list to view its details.
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            const tabsHtml = openIssueTransactions.map(function(transactionNo) {
                const tabIssue = findIssueRecord(transactionNo);

                if (!tabIssue) {
                    return "";
                }

                const { chipTitle, chipInitials } = getIssueChipInfo(tabIssue);
                const isActive = transactionNo === activeIssueTransaction;

                return `
                    <div
                        class="issue-chip ${isActive ? "active" : ""}"
                        onclick="selectIssueTab('${transactionNo.replace(/'/g, "\\'")}')"
                    >
                        <span class="issue-chip-avatar">${escapeIssueHtml(chipInitials)}</span>
                        <div>
                            <div class="issue-chip-title">${escapeIssueHtml(chipTitle)}</div>
                            <div class="issue-chip-code">${escapeIssueHtml(transactionNo)}</div>
                        </div>
                        <button
                            type="button"
                            class="issue-chip-close"
                            onclick="closeIssueTab('${transactionNo.replace(/'/g, "\\'")}', event)"
                            title="Close"
                        >×</button>
                    </div>
                `;
            }).join("");

            const activeIssue = findIssueRecord(activeIssueTransaction);

            const contentHtml = activeIssue
                ? buildIssueDetailContentHtml(activeIssue)
                : "";

            pane.innerHTML = `
                <div class="issue-chip-bar">${tabsHtml}</div>
                ${contentHtml}
            `;
        }


        /* =====================================================
           VIEW ISSUE
        ====================================================== */

        function viewIssue(transactionNo) {


            window.location.href =
                `issue-view.html?id=${encodeURIComponent(
                    transactionNo
                )}`;


        }



        /* =====================================================
           OPEN ISSUE ASSET PAGE
        ====================================================== */

        function openIssueAsset() {


            window.location.href =
                "issue-create.html";


        }



        /* =====================================================
           TOGGLE FILTERS
        ====================================================== */

        function toggleIssueFilters() {

            const filters = document.getElementById("issueFilters");
            const chevron = document.getElementById("filterChevron");

            if (!filters) {
                console.error("Issue filter panel not found.");
                return;
            }

            const isHidden = filters.classList.contains("hidden");

            if (isHidden) {
                filters.classList.remove("hidden");

                if (chevron) {
                    chevron.textContent = "⌃";
                }

                // Keep the popup above the issue list.
                filters.style.zIndex = "9999";
            } else {
                filters.classList.add("hidden");

                if (chevron) {
                    chevron.textContent = "›";
                }
            }
        }


        document.addEventListener("click", function(event) {

            const filters = document.getElementById("issueFilters");
            const filterButton = document.querySelector(".issue-filter-button");

            if (!filters || filters.classList.contains("hidden")) {
                return;
            }

            if (
                !filters.contains(event.target) &&
                !filterButton?.contains(event.target)
            ) {
                filters.classList.add("hidden");

                const chevron = document.getElementById("filterChevron");
                if (chevron) {
                    chevron.textContent = "›";
                }
            }
        });


        /* =====================================================
           POPULATE FILTER DROPDOWNS
        ====================================================== */

        function populateIssueFilters() {

            const issueTypeSelect =
                document.getElementById("issueTypeFilter");

            const createdBySelect =
                document.getElementById("createdByFilter");

            const issueTypes = [
                ...new Set(
                    allIssueRows.map(issue => issue.issueType).filter(Boolean)
                )
            ].sort();

            const createdByUsers = [
                ...new Set(
                    allIssueRows.map(issue => issue.createdBy).filter(Boolean)
                )
            ].sort();

            issueTypes.forEach(function(type) {
                const option = document.createElement("option");
                option.value = type;
                option.textContent = type;
                issueTypeSelect.appendChild(option);
            });

            createdByUsers.forEach(function(user) {
                const option = document.createElement("option");
                option.value = user;
                option.textContent = user;
                createdBySelect.appendChild(option);
            });
        }


        function getIssueDateValue(dateText) {

            if (!dateText) {
                return "";
            }

            const match = dateText.match(
                /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/
            );

            if (!match) {
                return "";
            }

            const months = {
                Jan: "01", Feb: "02", Mar: "03", Apr: "04",
                May: "05", Jun: "06", Jul: "07", Aug: "08",
                Sep: "09", Oct: "10", Nov: "11", Dec: "12"
            };

            const day = String(match[1]).padStart(2, "0");
            const month = months[match[2]];
            const year = match[3];

            return month ? `${year}-${month}-${day}` : "";
        }

        function filterIssues() {

            const transactionDate =
                document.getElementById("transactionDateFilter").value.trim();

            const issueType =
                document.getElementById("issueTypeFilter").value.trim();

            const transactionNo =
                document.getElementById("transactionNoFilter").value
                    .toLowerCase()
                    .trim();

            const createdBy =
                document.getElementById("createdByFilter").value.trim();

            const issuedTo =
                document.getElementById("issuedToFilter").value
                    .toLowerCase()
                    .trim();

            const filtered = allIssueRows.filter(function(issue) {

                const issueDetail = mergeIssueData(issue);

                const matchesDate =
                    !transactionDate ||
                    getIssueDateValue(issueDetail.transactionDate) === transactionDate;

                const matchesIssueType =
                    !issueType ||
                    issueDetail.issueType === issueType;

                const matchesTransactionNo =
                    !transactionNo ||
                    String(issueDetail.transactionNo)
                        .toLowerCase()
                        .includes(transactionNo);

                const matchesCreatedBy =
                    !createdBy ||
                    issueDetail.createdBy === createdBy;

                const matchesIssuedTo =
                    !issuedTo ||
                    String(
                        issueDetail.issuedTo ??
                        issueDetail.issuedToName ??
                        issueDetail.employee ??
                        issueDetail.custodian ??
                        issueDetail.supplier ??
                        ""
                    )
                        .toLowerCase()
                        .includes(issuedTo);

                return (
                    matchesDate &&
                    matchesIssueType &&
                    matchesTransactionNo &&
                    matchesCreatedBy &&
                    matchesIssuedTo
                );
            });

            displayIssues(filtered);
        }


        function resetIssueFilters() {

            document.getElementById("transactionDateFilter").value = "";
            document.getElementById("issueTypeFilter").value = "";
            document.getElementById("transactionNoFilter").value = "";
            document.getElementById("createdByFilter").value = "";
            document.getElementById("issuedToFilter").value = "";

            displayIssues(allIssueRows);
        }


        function reloadIssues() {

            resetIssueFilters();

            const selectAll = document.getElementById("selectAll");

            if (selectAll) {
                selectAll.checked = false;
            }
        }


        function selectAllIssues(source) {


            const checkboxes =
                document.querySelectorAll(
                    ".issue-checkbox"
                );


            checkboxes.forEach(
                function(checkbox) {

                    checkbox.checked =
                        source.checked;

                }
            );


        }



        /* =====================================================
           TRANSACTION NO SEARCH - ENTER KEY
        ====================================================== */

        document
            .getElementById("transactionNoFilter")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        filterIssues();
                    }

                }
            );
        

        const issueQuickSearch = document.getElementById("issueQuickSearch");

        if (issueQuickSearch) {
            issueQuickSearch.addEventListener("input", function() {

                const query = this.value.toLowerCase().trim();

                const filtered = allIssueRows.filter(function(issue) {

                    const issueDetail = mergeIssueData(issue);

                    const searchable = [
                        issueDetail.transactionNo,
                        issueDetail.transactionDate,
                        issueDetail.issueType,
                        issueDetail.createdBy,
                        issueDetail.issuedTo,
                        issueDetail.issuedToName,
                        issueDetail.employee,
                        issueDetail.custodian,
                        issueDetail.supplier,
                        issueDetail.asset?.assetName,
                        issueDetail.asset?.assetTag
                    ].filter(Boolean).join(" ").toLowerCase();

                    return searchable.includes(query);
                });

                displayIssues(filtered);
            });
        }

        // =====================================================
        // SAVED ISSUE TRANSACTIONS
        // =====================================================

        function getSavedIssueTransactions() {

            try {

                const saved =
                    sessionStorage.getItem(
                        "savedIssueTransactions"
                    );

                if (!saved) {
                    return [];
                }

                const parsed =
                    JSON.parse(saved);

                return Array.isArray(parsed)
                    ? parsed
                    : [];

            } catch (error) {

                console.error(
                    "Unable to load saved issue transactions:",
                    error
                );

                return [];
            }
        }
        const savedIssueTransactions =
            getSavedIssueTransactions();
        const allIssueRows = [
            ...savedIssueTransactions,
            ...issueRows
        ];
        populateIssueFilters();
        displayIssues(allIssueRows);
    </script>
</body>

</html>
