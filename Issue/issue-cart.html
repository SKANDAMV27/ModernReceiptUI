<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Cart - EAM</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .cart-page-card{
            margin-top:20px;
            border:1px solid #e2e8f0;
            border-radius:16px;
            background:#fff;
            box-shadow:0 4px 18px rgba(15,23,42,.05);
            overflow:hidden
        }

        .cart-page-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            padding:20px 22px;
            border-bottom:1px solid #e5e7eb
        }

        .cart-page-title{
            display:flex;
            align-items:center;
            gap:13px
        }

        .cart-page-icon{
            width:44px;
            height:44px;
            display:grid;
            place-items:center;
            border-radius:12px;
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            color:#fff;
            font-size:20px
        }

        .cart-page-title h2{
            margin:0;
            color:#0f172a;
            font-size:19px
        }

        .cart-page-title p{
            margin:4px 0 0;
            color:#64748b;
            font-size:12px
        }

        .cart-page-count{
            min-width:42px;
            height:34px;
            padding:0 12px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border-radius:999px;
            background:#eff6ff;
            color:#1d4ed8;
            border:1px solid #dbeafe;
            font-size:13px;
            font-weight:800
        }

        .cart-table-wrapper{
            overflow-x:auto
        }

        .cart-table{
            width:100%;
            min-width:850px;
            border-collapse:collapse
        }

        .cart-table th,
        .cart-table td{
            padding:13px 14px;
            border-bottom:1px solid #edf2f7;
            text-align:left;
            font-size:13px;
            vertical-align:middle
        }

        .cart-table th{
            background:#f8fafc;
            color:#475569;
            font-size:11px;
            font-weight:800;
            letter-spacing:.04em;
            text-transform:uppercase
        }

        .cart-table tbody tr:hover{
            background:#f8fbff
        }

        .cart-table tbody tr.row-selected{
            background:#eff6ff
        }

        /* Checkbox */
        .cart-checkbox-wrapper{
            display:flex;
            align-items:center;
            justify-content:center
        }

        .cart-checkbox{
            width:17px;
            height:17px;
            cursor:pointer;
            accent-color:#2563eb
        }

        .cart-select-all{
            width:17px;
            height:17px;
            cursor:pointer;
            accent-color:#2563eb
        }

        .cart-number{
            color:#64748b;
            font-weight:700;
            width:50px
        }

        .cart-asset-tag{
            color:#1d4ed8;
            font-weight:800
        }

        .cart-stock-badge{
            display:inline-flex;
            padding:5px 9px;
            border-radius:999px;
            background:#ecfdf5;
            color:#15803d;
            font-size:11px;
            font-weight:800
        }

        /* Delete icon */
        .cart-delete-button{
            width:34px;
            height:34px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:1px solid #fecaca;
            border-radius:8px;
            background:#fff;
            color:#dc2626;
            cursor:pointer;
            font-size:16px;
            transition:.2s ease
        }

        .cart-delete-button:hover{
            background:#fee2e2;
            border-color:#fca5a5;
            color:#b91c1c;
            transform:translateY(-1px)
        }

        /* Delete selected */
        .cart-delete-selected-button{
            min-height:38px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            padding:0 14px;
            border:1px solid #fecaca;
            border-radius:9px;
            background:#fff;
            color:#dc2626;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            transition:.2s ease
        }

        .cart-delete-selected-button:hover{
            background:#fee2e2;
            border-color:#fca5a5;
            color:#b91c1c
        }

        .cart-delete-selected-button:disabled{
            opacity:.5;
            cursor:not-allowed;
            background:#f8fafc;
            color:#94a3b8;
            border-color:#e2e8f0
        }

        .cart-selection-toolbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:12px 22px;
            border-bottom:1px solid #e5e7eb;
            background:#fff
        }

        .cart-selected-info{
            color:#64748b;
            font-size:12px
        }

        .cart-selected-info strong{
            color:#0f172a
        }

        .cart-empty-state{
            padding:58px 20px;
            text-align:center
        }

        .cart-empty-icon{
            width:64px;
            height:64px;
            margin:0 auto 14px;
            display:grid;
            place-items:center;
            border-radius:18px;
            background:#f1f5f9;
            color:#64748b;
            font-size:27px
        }

        .cart-empty-state h3{
            margin:0 0 7px;
            color:#0f172a;
            font-size:18px
        }

        .cart-empty-state p{
            max-width:460px;
            margin:0 auto 18px;
            color:#64748b;
            font-size:13px;
            line-height:1.5
        }

        .cart-page-footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            padding:16px 22px;
            border-top:1px solid #e5e7eb;
            background:#fff
        }

        .cart-footer-info{
            color:#64748b;
            font-size:12px
        }

        .cart-footer-info strong{
            color:#0f172a
        }

        .cart-actions{
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:10px;
            flex-wrap:wrap
        }

        .cart-action-button{
            min-height:40px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            padding:0 15px;
            border-radius:9px;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            transition:.2s ease
        }

        .cart-back-button{
            border:1px solid #d8e1ec;
            background:#fff;
            color:#475569
        }

        .cart-back-button:hover{
            background:#f8fafc;
            color:#0f172a
        }

        .cart-empty-button{
            border:1px solid #fed7aa;
            background:#fff7ed;
            color:#c2410c
        }

        .cart-empty-button:hover{
            background:#ffedd5
        }

        .cart-issue-button{
            border:1px solid #16a34a;
            background:#16a34a;
            color:#fff;
            box-shadow:0 5px 12px rgba(22,163,74,.16)
        }

        .cart-issue-button:hover{
            background:#15803d;
            border-color:#15803d;
            transform:translateY(-1px)
        }

        @media(max-width:700px){

            .cart-page-header,
            .cart-page-footer,
            .cart-selection-toolbar{
                flex-direction:column;
                align-items:stretch
            }

            .cart-page-count{
                align-self:flex-start
            }

            .cart-actions{
                display:grid;
                grid-template-columns:1fr
            }

            .cart-action-button{
                width:100%
            }

            .cart-delete-selected-button{
                width:100%
            }
        }
    </style>
</head>

<body>

<div id="sidebar"></div>

<div class="main-content">

    <div id="header"></div>

    <main class="page-content">

        <div class="page-breadcrumb">
            <span>EAM</span>
            <span>›</span>
            <span>Issue</span>
            <span>›</span>
            <strong>Issue Cart</strong>
        </div>

        <div class="page-header">
            <div>
                <h1>Issue Cart</h1>
                <p>Review the assets selected for issuing before continuing.</p>
            </div>
        </div>

        <section class="cart-page-card">

            <!-- Header -->
            <div class="cart-page-header">

                <div class="cart-page-title">

                    <div class="cart-page-icon">
                        🛒
                    </div>

                    <div>
                        <h2>Selected Assets</h2>
                        <p>These assets are currently ready to be issued.</p>
                    </div>

                </div>

                <span id="cartPageCount" class="cart-page-count">
                        0
                    </span>

            </div>

            <!-- Selection Toolbar -->
            <div id="cartSelectionToolbar"
                 class="cart-selection-toolbar">

                <div class="cart-selected-info">
                    <strong id="selectedAssetsCount">0</strong>
                    asset(s) selected
                </div>

                <button
                        type="button"
                        id="deleteSelectedButton"
                        class="cart-delete-selected-button"
                        onclick="deleteSelectedAssets()"
                        disabled>

                    🗑 Delete Selected

                </button>

            </div>

            <!-- Cart Content -->
            <div id="cartContent"></div>

            <!-- Footer -->
            <div id="cartPageFooter"
                 class="cart-page-footer">

                <div class="cart-footer-info">

                    <strong id="cartFooterCount">0</strong>
                    asset(s) in cart

                </div>

                <div class="cart-actions">

                    <button
                            type="button"
                            class="cart-action-button cart-back-button"
                            onclick="goBackToAssets()">

                        ← Back to Assets

                    </button>

                    <button
                            type="button"
                            class="cart-action-button cart-empty-button"
                            onclick="emptyCart()">

                        ⊗ Empty Cart

                    </button>

                    <button
                            type="button"
                            class="cart-action-button cart-issue-button"
                            onclick="issueAssetsFromCart()">

                        ✓ Issue Assets From Cart

                    </button>

                </div>

            </div>

        </section>

    </main>

    <div id="footer"></div>

</div>

<script src="./js/layout.js"></script>

<script>

    let cart = [];

    /*
     * Store selected cart indexes.
     * Example:
     * [0, 2, 4]
     */
    let selectedCartIndexes = new Set();


    // =====================================================
    // LOAD CART
    // =====================================================

    function loadCart(){

        try{

            const saved =
                sessionStorage.getItem("issueCart");

            cart = saved
                ? JSON.parse(saved)
                : [];

            if(!Array.isArray(cart)){
                cart = [];
            }

        }catch(error){

            console.error(
                "Unable to load issue cart.",
                error
            );

            cart = [];
        }

        selectedCartIndexes.clear();
    }


    // =====================================================
    // SAVE CART
    // =====================================================

    function saveCart(){

        sessionStorage.setItem(
            "issueCart",
            JSON.stringify(cart)
        );
    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value){

        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }


    // =====================================================
    // DISPLAY VALUE
    // =====================================================

    function displayValue(value){

        if(
            value === null ||
            value === undefined ||
            String(value).trim() === ""
        ){

            return '<span style="color:#94a3b8;">-</span>';
        }

        return escapeHtml(String(value));
    }


    // =====================================================
    // UPDATE SELECTION UI
    // =====================================================

    function updateSelectionUI(){

        const selectedCount =
            selectedCartIndexes.size;

        const selectedAssetsCount =
            document.getElementById(
                "selectedAssetsCount"
            );

        const deleteSelectedButton =
            document.getElementById(
                "deleteSelectedButton"
            );

        if(selectedAssetsCount){

            selectedAssetsCount.textContent =
                String(selectedCount);
        }

        if(deleteSelectedButton){

            deleteSelectedButton.disabled =
                selectedCount === 0;
        }

        /*
         * Update row highlight
         */
        document
            .querySelectorAll(".cart-row-checkbox")
            .forEach(function(checkbox){

                const index =
                    Number(checkbox.dataset.index);

                const row =
                    checkbox.closest("tr");

                if(row){

                    row.classList.toggle(
                        "row-selected",
                        selectedCartIndexes.has(index)
                    );
                }
            });


        /*
         * Update Select All checkbox
         */
        const selectAllCheckbox =
            document.getElementById(
                "selectAllCart"
            );

        if(!selectAllCheckbox){

            return;
        }

        if(cart.length === 0){

            selectAllCheckbox.checked = false;
            selectAllCheckbox.indeterminate = false;
            return;
        }

        const selected =
            selectedCartIndexes.size;

        if(selected === 0){

            selectAllCheckbox.checked = false;
            selectAllCheckbox.indeterminate = false;

        }else if(selected === cart.length){

            selectAllCheckbox.checked = true;
            selectAllCheckbox.indeterminate = false;

        }else{

            selectAllCheckbox.checked = false;
            selectAllCheckbox.indeterminate = true;
        }
    }


    // =====================================================
    // TOGGLE SINGLE ASSET
    // =====================================================

    function toggleCartSelection(index){

        if(selectedCartIndexes.has(index)){

            selectedCartIndexes.delete(index);

        }else{

            selectedCartIndexes.add(index);
        }

        updateSelectionUI();
    }


    // =====================================================
    // SELECT / UNSELECT ALL
    // =====================================================

    function toggleSelectAll(){

        const selectAllCheckbox =
            document.getElementById(
                "selectAllCart"
            );

        if(!selectAllCheckbox){

            return;
        }

        if(selectAllCheckbox.checked){

            selectedCartIndexes =
                new Set(
                    cart.map(function(_,index){
                        return index;
                    })
                );

        }else{

            selectedCartIndexes.clear();
        }

        updateSelectionUI();
    }


    // =====================================================
    // RENDER CART
    // =====================================================

    function renderCart(){

        const content =
            document.getElementById(
                "cartContent"
            );

        const count =
            document.getElementById(
                "cartPageCount"
            );

        const footerCount =
            document.getElementById(
                "cartFooterCount"
            );

        const toolbar =
            document.getElementById(
                "cartSelectionToolbar"
            );

        count.textContent =
            String(cart.length);

        footerCount.textContent =
            String(cart.length);


        // Empty cart
        if(cart.length === 0){

            selectedCartIndexes.clear();

            content.innerHTML = `

                    <div class="cart-empty-state">

                        <div class="cart-empty-icon">
                            🛒
                        </div>

                        <h3>
                            Your cart is empty
                        </h3>

                        <p>
                            No assets have been added yet.
                            Go back to the available assets
                            and select the assets you want to issue.
                        </p>

                        <button
                            type="button"
                            class="cart-action-button cart-back-button"
                            onclick="goBackToAssets()">

                            ← Select Assets

                        </button>

                    </div>
                `;

            document
                .getElementById("cartPageFooter")
                .style.display = "none";

            if(toolbar){

                toolbar.style.display = "none";
            }

            updateSelectionUI();

            return;
        }


        document
            .getElementById("cartPageFooter")
            .style.display = "flex";


        if(toolbar){

            toolbar.style.display = "flex";
        }


        // =================================================
        // CREATE TABLE ROWS
        // =================================================

        const rows = cart.map(
            function(asset,index){

                const isSelected =
                    selectedCartIndexes.has(index);

                return `

                        <tr class="${isSelected ? "row-selected" : ""}">

                            <!-- Checkbox -->
                            <td>

                                <div class="cart-checkbox-wrapper">

                                    <input
                                        type="checkbox"
                                        class="cart-checkbox cart-row-checkbox"
                                        data-index="${index}"
                                        ${isSelected ? "checked" : ""}
                                        onchange="toggleCartSelection(${index})"
                                    >

                                </div>

                            </td>


                            <!-- Sl No -->
                            <td class="cart-number">
                                ${index + 1}
                            </td>


                            <!-- Asset Tag -->
                            <td>
                                <span class="cart-asset-tag">
                                    ${escapeHtml(asset.assetTag)}
                                </span>
                            </td>


                            <!-- Asset Name -->
                            <td>
                                <strong>
                                    ${escapeHtml(asset.assetName)}
                                </strong>
                            </td>


                            <!-- Serial No -->
                            <td>
                                ${displayValue(asset.serialNo)}
                            </td>


                            <!-- Model -->
                            <td>
                                ${displayValue(asset.model)}
                            </td>


                            <!-- Manufacturer -->
                            <td>
                                ${displayValue(asset.manufacturer)}
                            </td>


                            <!-- Location -->
                            <td>
                                ${displayValue(asset.location)}
                            </td>


                            <!-- Status -->
                            <td>
                                <span class="cart-stock-badge">
                                    ${escapeHtml(
                    asset.stockStatus ||
                    "In Stock"
                )}
                                </span>
                            </td>


                            <!-- Delete -->
                            <td>

                                <button
                                    type="button"
                                    class="cart-delete-button"
                                    title="Delete Asset"
                                    onclick="deleteSingleAsset(${index})">

                                    🗑

                                </button>

                            </td>

                        </tr>
                    `;
            }
        ).join("");


        // =================================================
        // TABLE
        // =================================================

        content.innerHTML = `

                <div class="cart-table-wrapper">

                    <table class="cart-table">

                        <thead>

                            <tr>

                                <th style="width:45px;text-align:center;">

                                    <input
                                        type="checkbox"
                                        id="selectAllCart"
                                        class="cart-select-all"
                                        onchange="toggleSelectAll()"
                                    >

                                </th>

                                <th>
                                    Sl.No
                                </th>

                                <th>
                                    Asset Tag
                                </th>

                                <th>
                                    Asset Name
                                </th>

                                <th>
                                    Serial No
                                </th>

                                <th>
                                    Model
                                </th>

                                <th>
                                    Manufacturer
                                </th>

                                <th>
                                    Location
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>

                        <tbody>

                            ${rows}

                        </tbody>

                    </table>

                </div>
            `;


        updateSelectionUI();
    }


    // =====================================================
    // DELETE SINGLE ASSET
    // =====================================================

    async function deleteSingleAsset(index){

        const asset = cart[index];

        if(!asset){

            return;
        }


        const assetName =
            asset.assetName ||
            asset.assetTag ||
            "this asset";


        const result = await Swal.fire({

            icon:"warning",

            title:"Delete Asset?",

            html:`
                    Are you sure you want to remove
                    <strong>${escapeHtml(assetName)}</strong>
                    from the cart?
                `,

            showCancelButton:true,

            confirmButtonText:"Yes, Delete",

            cancelButtonText:"Cancel",

            confirmButtonColor:"#dc2626",

            cancelButtonColor:"#64748b",

            reverseButtons:true

        });


        if(!result.isConfirmed){

            return;
        }


        cart.splice(index,1);

        saveCart();

        selectedCartIndexes.clear();

        renderCart();


        await Swal.fire({

            icon:"success",

            title:"Asset Removed",

            text:"The asset has been removed from the cart.",

            confirmButtonText:"OK",

            confirmButtonColor:"#16a34a"

        });
    }


    // =====================================================
    // DELETE SELECTED ASSETS
    // =====================================================

    async function deleteSelectedAssets(){

        const selectedIndexes =
            Array.from(selectedCartIndexes)
                .sort(function(a,b){
                    return b-a;
                });


        if(selectedIndexes.length === 0){

            await Swal.fire({

                icon:"info",

                title:"No Assets Selected",

                text:"Please select at least one asset to delete.",

                confirmButtonText:"OK",

                confirmButtonColor:"#2563eb"

            });

            return;
        }


        const result = await Swal.fire({

            icon:"warning",

            title:"Delete Selected Assets?",

            html:`
                    Are you sure you want to remove
                    <strong>
                        ${selectedIndexes.length}
                        selected asset${selectedIndexes.length !== 1 ? "s" : ""}
                    </strong>
                    from the cart?
                `,

            showCancelButton:true,

            confirmButtonText:"Yes, Delete",

            cancelButtonText:"Cancel",

            confirmButtonColor:"#dc2626",

            cancelButtonColor:"#64748b",

            reverseButtons:true

        });


        if(!result.isConfirmed){

            return;
        }


        /*
         * Delete from highest index to lowest index.
         * This prevents index shifting problems.
         */
        selectedIndexes.forEach(function(index){

            cart.splice(index,1);

        });


        saveCart();

        selectedCartIndexes.clear();

        renderCart();


        await Swal.fire({

            icon:"success",

            title:"Assets Removed",

            text:
                `${selectedIndexes.length} asset${
                    selectedIndexes.length !== 1
                        ? "s have"
                        : " has"
                } been removed from the cart.`,

            confirmButtonText:"OK",

            confirmButtonColor:"#16a34a"

        });
    }


    // =====================================================
    // EMPTY ENTIRE CART
    // =====================================================

    async function emptyCart(){

        if(cart.length === 0){

            await Swal.fire({

                icon:"info",

                title:"Cart is Already Empty",

                text:"There are no assets to remove.",

                confirmButtonText:"OK",

                confirmButtonColor:"#2563eb"

            });

            return;
        }


        const result = await Swal.fire({

            icon:"warning",

            title:"Empty Cart?",

            html:`
                    Are you sure you want to remove
                    <strong>
                        all ${cart.length} selected asset${
                cart.length !== 1 ? "s" : ""
            }
                    </strong>
                    from the cart?
                `,

            showCancelButton:true,

            confirmButtonText:"Yes, Empty Cart",

            cancelButtonText:"Cancel",

            confirmButtonColor:"#dc2626",

            cancelButtonColor:"#64748b",

            reverseButtons:true

        });


        if(!result.isConfirmed){

            return;
        }


        cart = [];

        selectedCartIndexes.clear();

        saveCart();

        renderCart();


        await Swal.fire({

            icon:"success",

            title:"Cart is Empty",

            text:"All selected assets have been removed from the cart.",

            confirmButtonText:"OK",

            confirmButtonColor:"#16a34a"

        });
    }


    // =====================================================
    // ISSUE ASSETS
    // =====================================================

    async function issueAssetsFromCart(){

        if(cart.length === 0){

            await Swal.fire({

                icon:"warning",

                title:"Cart is Empty",

                text:"Please add assets to the cart before continuing.",

                confirmButtonText:"OK",

                confirmButtonColor:"#2563eb"

            });

            return;
        }


        sessionStorage.setItem(
            "issueCart",
            JSON.stringify(cart)
        );


        window.location.href =
            "issue-form.html";
    }


    // =====================================================
    // BACK TO ASSETS
    // =====================================================

    function goBackToAssets(){

        window.location.href =
            "issue-create.html";
    }


    // =====================================================
    // PAGE LOAD
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function(){

            loadCart();

            renderCart();

        }
    );

</script>

</body>
</html>
