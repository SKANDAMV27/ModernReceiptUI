<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Cart - EAM</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .cart-page-card{margin-top:20px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;box-shadow:0 4px 18px rgba(15,23,42,.05);overflow:hidden}
        .cart-page-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;border-bottom:1px solid #e5e7eb}
        .cart-page-title{display:flex;align-items:center;gap:13px}
        .cart-page-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:20px}
        .cart-page-title h2{margin:0;color:#0f172a;font-size:19px}
        .cart-page-title p{margin:4px 0 0;color:#64748b;font-size:12px}
        .cart-page-count{min-width:42px;height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe;font-size:13px;font-weight:800}
        .cart-table-wrapper{overflow-x:auto}
        .cart-table{width:100%;min-width:760px;border-collapse:collapse}
        .cart-table th,.cart-table td{padding:13px 14px;border-bottom:1px solid #edf2f7;text-align:left;font-size:13px;vertical-align:middle}
        .cart-table th{background:#f8fafc;color:#475569;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
        .cart-table tbody tr:hover{background:#f8fbff}
        .cart-number{color:#64748b;font-weight:700;width:50px}
        .cart-asset-tag{color:#1d4ed8;font-weight:800}
        .cart-stock-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#15803d;font-size:11px;font-weight:800}
        .cart-empty-state{padding:58px 20px;text-align:center}
        .cart-empty-icon{width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;border-radius:18px;background:#f1f5f9;color:#64748b;font-size:27px}
        .cart-empty-state h3{margin:0 0 7px;color:#0f172a;font-size:18px}
        .cart-empty-state p{max-width:460px;margin:0 auto 18px;color:#64748b;font-size:13px;line-height:1.5}
        .cart-page-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-top:1px solid #e5e7eb;background:#fff}
        .cart-footer-info{color:#64748b;font-size:12px}.cart-footer-info strong{color:#0f172a}
        .cart-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
        .cart-action-button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s ease}
        .cart-back-button{border:1px solid #d8e1ec;background:#fff;color:#475569}.cart-back-button:hover{background:#f8fafc;color:#0f172a}
        .cart-empty-button{border:1px solid #fed7aa;background:#fff7ed;color:#c2410c}.cart-empty-button:hover{background:#ffedd5}
        .cart-issue-button{border:1px solid #16a34a;background:#16a34a;color:#fff;box-shadow:0 5px 12px rgba(22,163,74,.16)}.cart-issue-button:hover{background:#15803d;border-color:#15803d;transform:translateY(-1px)}
        @media(max-width:700px){.cart-page-header,.cart-page-footer{flex-direction:column;align-items:stretch}.cart-page-count{align-self:flex-start}.cart-actions{display:grid;grid-template-columns:1fr}.cart-action-button{width:100%}}
    </style>
</head>
<body>
    <div id="sidebar"></div>
    <div class="main-content">
        <div id="header"></div>
        <main class="page-content">
            <div class="page-breadcrumb"><span>EAM</span><span>›</span><span>Issue</span><span>›</span><strong>Issue Cart</strong></div>
            <div class="page-header">
                <div>
                    <h1>Issue Cart</h1>
                    <p>Review the assets selected for issuing before continuing.</p>
                </div>
            </div>

            <section class="cart-page-card">
                <div class="cart-page-header">
                    <div class="cart-page-title">
                        <div class="cart-page-icon">🛒</div>
                        <div><h2>Selected Assets</h2><p>These assets are currently ready to be issued.</p></div>
                    </div>
                    <span id="cartPageCount" class="cart-page-count">0</span>
                </div>

                <div id="cartContent"></div>

                <div id="cartPageFooter" class="cart-page-footer">
                    <div class="cart-footer-info"><strong id="cartFooterCount">0</strong> asset(s) selected</div>
                    <div class="cart-actions">
                        <button type="button" class="cart-action-button cart-back-button" onclick="goBackToAssets()">← Back to Assets</button>
                        <button type="button" class="cart-action-button cart-empty-button" onclick="emptyCart()">⊗ Empty Cart</button>
                        <button type="button" class="cart-action-button cart-issue-button" onclick="issueAssetsFromCart()">✓ Issue Assets From Cart</button>
                    </div>
                </div>
            </section>
        </main>
        <div id="footer"></div>
    </div>

    <script src="./js/layout.js"></script>
    <script>
        let cart=[];

        function loadCart(){
            try{
                const saved=sessionStorage.getItem("issueCart");
                cart=saved?JSON.parse(saved):[];
                if(!Array.isArray(cart)) cart=[];
            }catch(error){
                console.error("Unable to load issue cart.",error);
                cart=[];
            }
        }

        function saveCart(){
            sessionStorage.setItem("issueCart",JSON.stringify(cart));
        }

        function escapeHtml(value){
            return String(value??"")
                .replace(/&/g,"&amp;").replace(/</g,"&lt;")
                .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
                .replace(/'/g,"&#039;");
        }

        function displayValue(value){
            if(value===null||value===undefined||String(value).trim()===""){
                return '<span style="color:#94a3b8;">-</span>';
            }
            return escapeHtml(String(value));
        }

        function renderCart(){
            const content=document.getElementById("cartContent");
            const count=document.getElementById("cartPageCount");
            const footerCount=document.getElementById("cartFooterCount");

            count.textContent=String(cart.length);
            footerCount.textContent=String(cart.length);

            if(cart.length===0){
                content.innerHTML=`
                    <div class="cart-empty-state">
                        <div class="cart-empty-icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>No assets have been added yet. Go back to the available assets and select the assets you want to issue.</p>
                        <button type="button" class="cart-action-button cart-back-button" onclick="goBackToAssets()">← Select Assets</button>
                    </div>`;
                document.getElementById("cartPageFooter").style.display="none";
                return;
            }

            document.getElementById("cartPageFooter").style.display="flex";

            const rows=cart.map(function(asset,index){
                return `
                    <tr>
                        <td class="cart-number">${index+1}</td>
                        <td><span class="cart-asset-tag">${escapeHtml(asset.assetTag)}</span></td>
                        <td><strong>${escapeHtml(asset.assetName)}</strong></td>
                        <td>${displayValue(asset.serialNo)}</td>
                        <td>${displayValue(asset.model)}</td>
                        <td>${displayValue(asset.manufacturer)}</td>
                        <td>${displayValue(asset.location)}</td>
                        <td><span class="cart-stock-badge">${escapeHtml(asset.stockStatus||"In Stock")}</span></td>
                    </tr>`;
            }).join("");

            content.innerHTML=`
                <div class="cart-table-wrapper">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Sl.No</th><th>Asset Tag</th><th>Asset Name</th>
                                <th>Serial No</th><th>Model</th><th>Manufacturer</th>
                                <th>Location</th><th>Status</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        async function emptyCart(){
            if(cart.length===0){
                await Swal.fire({icon:"info",title:"Cart is Already Empty",text:"There are no assets to remove.",confirmButtonText:"OK",confirmButtonColor:"#2563eb"});
                return;
            }

            const result=await Swal.fire({
                icon:"warning",
                title:"Empty Cart?",
                html:`Are you sure you want to remove <strong>all ${cart.length} selected asset${cart.length!==1?"s":""}</strong> from the cart?`,
                showCancelButton:true,
                confirmButtonText:"Yes, Empty Cart",
                cancelButtonText:"Cancel",
                confirmButtonColor:"#dc2626",
                cancelButtonColor:"#64748b",
                reverseButtons:true
            });

            if(!result.isConfirmed) return;

            cart=[];
            saveCart();
            renderCart();

            await Swal.fire({
                icon:"success",
                title:"Cart is Empty",
                text:"All selected assets have been removed from the cart.",
                confirmButtonText:"OK",
                confirmButtonColor:"#16a34a"
            });
        }

        async function issueAssetsFromCart(){
            if(cart.length===0){
                await Swal.fire({icon:"warning",title:"Cart is Empty",text:"Please add assets to the cart before continuing.",confirmButtonText:"OK",confirmButtonColor:"#2563eb"});
                return;
            }

            sessionStorage.setItem("issueCart",JSON.stringify(cart));
            window.location.href="issue-form.html";
        }

        function goBackToAssets(){
            window.location.href="issue-create.html";
        }

        document.addEventListener("DOMContentLoaded",function(){
            loadCart();
            renderCart();
        });
    </script>
</body>
</html>
